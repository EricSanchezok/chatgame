rule_packages:
  - id: core-d20
    version: 1.1.0
    config:
      damageUsesMeters: true
meters:
  - id: health
    name: 生命
    min: 0
    max: 20
    thresholds:
      - id: death-at-zero
        when: { operator: lte, value: 0 }
        effects:
          - { kind: set_lifecycle, lifecycle: retired }
quantities:
  - id: spirit-stone
    name: 灵石
    unit: 枚
    production_law_ids: []
    consumption_law_ids: [no-free-spirit-stones]
ratings:
  - id: resolve
    name: 决心
    min: -5
    max: 10
