facts:
  - id: sigrun-column-strength
    predicate: headcount
    value: { kind: number, value: 121 }
    description: 队伍由 Sigrun、两名队长、三名副官和一百一十五名普通 brigands 组成。
    access: { kind: private }
  - id: sigrun-column-readiness
    predicate: readiness
