<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="醒神汤：粗陶药碗">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2218"/>
      <stop offset="1" stop-color="#120c07"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a3a"/>
      <stop offset="0.5" stop-color="#6b4320"/>
      <stop offset="1" stop-color="#4a2c16"/>
    </linearGradient>
    <linearGradient id="broth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5a2a"/>
      <stop offset="1" stop-color="#3a3018"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="17" fill="none" stroke="#4a3a28" stroke-width="2" opacity="0.6"/>
  <g>
    <ellipse cx="64" cy="74" rx="46" ry="12" fill="#2c1c10"/>
    <!-- bowl -->
    <path d="M24 44 Q64 34 104 44 L98 86 Q64 98 30 86 Z" fill="url(#clay)"/>
    <path d="M24 44 Q64 34 104 44 L104 52 Q64 42 24 52 Z" fill="#a87048"/>
    <path d="M30 62 Q64 52 98 62" stroke="#8a5a3a" stroke-width="3" fill="none"/>
    <!-- broth -->
    <ellipse cx="64" cy="46" rx="38" ry="10" fill="url(#broth)"/>
    <ellipse cx="64" cy="45" rx="26" ry="5" fill="#8a742f" opacity="0.7"/>
    <!-- steam -->
    <g stroke="#cbb89a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M48 32 q-6 -10 2 -18"/>
      <path d="M66 26 q-4 -12 6 -20"/>
      <path d="M84 32 q-8 -10 0 -20"/>
    </g>
    <!-- herb leaf floating -->
    <path d="M64 44 q-10 -6 -14 2 q10 6 14 -2 Z" fill="#4a6839"/>
  </g>
</svg>
