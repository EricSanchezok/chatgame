<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="煤精灯笼：青白色灯火">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241c15"/>
      <stop offset="1" stop-color="#0d0906"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6b4a"/>
      <stop offset="0.5" stop-color="#c9a36a"/>
      <stop offset="1" stop-color="#6b5138"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ab8c8" stop-opacity="0.5"/>
      <stop offset="0.25" stop-color="#d6f4ff" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#9fd8e8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#4a8898" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d6f4ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#9fd8e8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9fd8e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="17" fill="none" stroke="#4a3a28" stroke-width="2" opacity="0.6"/>
  <g>
    <!-- handle -->
    <path d="M48 16 q16 -12 32 0" stroke="url(#brass)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- top cap -->
    <rect x="40" y="16" width="48" height="10" rx="4" fill="url(#brass)"/>
    <rect x="50" y="26" width="28" height="6" rx="3" fill="#8a6b4a"/>
    <!-- body -->
    <path d="M38 32 Q64 22 90 32 L90 76 Q64 88 38 76 Z" fill="url(#glass)"/>
    <!-- inner light -->
    <circle cx="64" cy="56" r="34" fill="url(#lampGlow)"/>
    <ellipse cx="64" cy="58" rx="14" ry="20" fill="#d6f4ff"/>
    <ellipse cx="64" cy="58" rx="7" ry="12" fill="#f2fcff"/>
    <!-- wick shard -->
    <path d="M60 60 L58 44 L70 40 L68 60 Z" fill="#1a2c34"/>
    <!-- base -->
    <rect x="42" y="76" width="44" height="8" rx="3" fill="url(#brass)"/>
    <path d="M56 84 q8 6 16 0 l-4 12 q-4 4 -8 4 t-8 -4 Z" fill="#6b5138"/>
  </g>
</svg>
