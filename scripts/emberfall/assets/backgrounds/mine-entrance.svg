<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="黑石矿井入口：封条、风灯与雾气的压抑外景">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0c0a"/>
      <stop offset="0.6" stop-color="#1e1712"/>
      <stop offset="1" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241d16"/>
      <stop offset="1" stop-color="#0d0a07"/>
    </linearGradient>
    <linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060404"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0b862" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#d8963c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d8963c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d6f4ff" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#9fd8e8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#9fd8e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1712"/>
      <stop offset="1" stop-color="#0f0c0a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft6" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- ridge silhouette -->
  <path d="M0 480 L200 340 L380 430 L560 300 L720 420 L900 330 L1100 440 L1300 350 L1600 430 L1600 640 L0 640 Z" fill="url(#mountain)"/>

  <!-- mine headframe -->
  <g stroke="#2e241b" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M760 620 V320"/>
    <path d="M850 620 V320"/>
    <path d="M760 360 L600 560"/>
    <path d="M850 360 L1010 560"/>
  </g>
  <path d="M740 300 H870" stroke="#3a2e22" stroke-width="16" stroke-linecap="round"/>
  <circle cx="805" cy="300" r="42" fill="#241c15"/>
  <circle cx="805" cy="300" r="42" fill="none" stroke="#4a3a28" stroke-width="8"/>
  <path d="M805 300 V470" stroke="#241c15" stroke-width="8"/>
  <rect x="770" y="470" width="70" height="46" rx="6" fill="#3a2e22"/>
  <circle cx="805" cy="493" r="16" fill="#120e0a"/>

  <!-- gallery entrance -->
  <g>
    <path d="M610 640 Q805 480 1000 640 L1000 740 L610 740 Z" fill="url(#mouth)"/>
    <path d="M586 640 Q805 448 1024 640" fill="none" stroke="#2e241b" stroke-width="40" stroke-linecap="round"/>
    <path d="M600 640 Q805 500 1010 640" fill="none" stroke="#1a1410" stroke-width="12"/>
    <!-- support beams inside the mouth -->
    <path d="M700 660 L700 740" stroke="#241c15" stroke-width="20"/>
    <path d="M910 660 L910 740" stroke="#241c15" stroke-width="20"/>
    <path d="M700 690 H910" stroke="#241c15" stroke-width="14"/>
    <!-- faint coal light deep inside -->
    <ellipse cx="805" cy="660" rx="90" ry="40" fill="#c96f2f" opacity="0.08" filter="url(#soft)"/>
  </g>

  <!-- sealed boards + warning sign -->
  <g>
    <path d="M640 690 H970" stroke="#4a3a28" stroke-width="12"/>
    <path d="M672 640 V740" stroke="#4a3a28" stroke-width="10"/>
    <path d="M938 640 V740" stroke="#4a3a28" stroke-width="10"/>
    <path d="M640 690 H970" stroke="#e8a04c" stroke-width="4" opacity="0.6"/>
    <path d="M672 640 V740" stroke="#e8a04c" stroke-width="3" opacity="0.6"/>
    <path d="M938 640 V740" stroke="#e8a04c" stroke-width="3" opacity="0.6"/>
  </g>
  <g>
    <rect x="1070" y="560" width="200" height="120" rx="6" fill="#3a2e22" stroke="#5a4630" stroke-width="6"/>
    <text x="1170" y="602" text-anchor="middle" font-family="serif" font-size="30" fill="#e8a04c">危险</text>
    <text x="1170" y="642" text-anchor="middle" font-family="serif" font-size="22" fill="#c9a36a">封矿令</text>
    <rect x="1090" y="552" width="24" height="136" fill="#3a2e22"/>
    <rect x="1226" y="552" width="24" height="136" fill="#3a2e22"/>
  </g>

  <!-- rail tracks -->
  <g>
    <path d="M0 800 H1600" stroke="#4a3a28" stroke-width="10"/>
    <path d="M0 840 H1600" stroke="#4a3a28" stroke-width="10"/>
    <path d="M0 730 H1600" stroke="#33281c" stroke-width="10"/>
    <path d="M0 780 H1600" stroke="#33281c" stroke-width="10"/>
    <g stroke="#5a4630" stroke-width="12">
      <path d="M60 730 V800 M180 730 V800 M300 730 V800 M420 730 V800 M540 730 V800 M660 730 V800 M780 730 V800 M900 730 V800 M1020 730 V800 M1140 730 V800 M1260 730 V800 M1380 730 V800 M1500 730 V800"/>
    </g>
  </g>
  <g>
    <rect x="240" y="640" width="260" height="70" rx="8" fill="#241c15" stroke="#3a2e22" stroke-width="5"/>
    <circle cx="290" cy="675" r="26" fill="#1a1410" stroke="#4a3a28" stroke-width="6"/>
    <circle cx="290" cy="675" r="10" fill="#8a5a2a"/>
    <circle cx="450" cy="675" r="26" fill="#1a1410" stroke="#4a3a28" stroke-width="6"/>
    <circle cx="450" cy="675" r="10" fill="#8a5a2a"/>
    <path d="M320 675 H420" stroke="#4a3a28" stroke-width="10"/>
  </g>

  <!-- ground -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#ground)"/>
  <path d="M0 660 H1600" stroke="#2e241b" stroke-width="4" opacity="0.5"/>
  <g fill="#3a2e22">
    <ellipse cx="180" cy="760" rx="60" ry="18"/><ellipse cx="420" cy="830" rx="80" ry="20"/>
    <ellipse cx="1300" cy="770" rx="55" ry="16"/><ellipse cx="1500" cy="840" rx="70" ry="18"/>
    <ellipse cx="60" cy="860" rx="90" ry="20"/>
  </g>

  <!-- glowing coal-essence lantern -->
  <g>
    <rect x="1190" y="430" width="10" height="180" fill="#241c15"/>
    <path d="M1172 430 h46 l-8 -16 h-30 Z" fill="#4a3a28"/>
    <rect x="1168" y="430" width="54" height="44" rx="6" fill="#241c15" stroke="#5a4630" stroke-width="4"/>
    <circle cx="1195" cy="452" r="80" fill="url(#lantern)"/>
    <ellipse cx="1195" cy="452" rx="16" ry="20" fill="#bfe8f2"/>
    <ellipse cx="1195" cy="452" rx="8" ry="12" fill="#eaf8ff"/>
  </g>

  <!-- hanging wind lamp by the entrance -->
  <g>
    <path d="M950 540 V560" stroke="#5a4630" stroke-width="6"/>
    <rect x="936" y="560" width="30" height="40" rx="5" fill="#241c15" stroke="#5a4630" stroke-width="4"/>
    <circle cx="951" cy="580" r="70" fill="url(#lampGlow)"/>
    <ellipse cx="951" cy="582" rx="8" ry="12" fill="#f0b862"/>
  </g>

  <!-- fog banks -->
  <g fill="#cbb89a" filter="url(#soft)">
    <ellipse cx="200" cy="720" rx="420" ry="36" opacity="0.1"/>
    <ellipse cx="900" cy="700" rx="500" ry="30" opacity="0.12"/>
    <ellipse cx="1350" cy="730" rx="380" ry="34" opacity="0.1"/>
    <ellipse cx="500" cy="770" rx="460" ry="28" opacity="0.08"/>
  </g>
  <ellipse cx="805" cy="920" rx="760" ry="100" fill="#000" opacity="0.6"/>
</svg>
