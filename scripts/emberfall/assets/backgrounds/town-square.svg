<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="灰烬镇广场：暮色下的石板广场与煤精路灯">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2417"/>
      <stop offset="0.45" stop-color="#6b3a20"/>
      <stop offset="0.78" stop-color="#c96f2f"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.72" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#f2b06a" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#e8894a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8894a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2218"/>
      <stop offset="1" stop-color="#171009"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c77a" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#e8a04c" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e8a04c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5cf8a"/>
      <stop offset="1" stop-color="#d98a3f"/>
    </radialGradient>
    <linearGradient id="bldg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c1e"/>
      <stop offset="1" stop-color="#1c140d"/>
    </linearGradient>
    <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2115"/>
      <stop offset="1" stop-color="#120c07"/>
    </linearGradient>
    <linearGradient id="awning" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3c22"/>
      <stop offset="0.5" stop-color="#b85a30"/>
      <stop offset="1" stop-color="#8a3c22"/>
    </linearGradient>
    <linearGradient id="postGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a04c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8a04c" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft8" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1152" cy="558" r="420" fill="url(#sunGlow)"/>

  <!-- distant blackstone ridge -->
  <path d="M0 520 L120 430 L260 470 L430 360 L610 460 L790 400 L980 470 L1180 390 L1360 455 L1600 410 L1600 640 L0 640 Z" fill="#221710" opacity="0.85"/>
  <path d="M0 560 L180 500 L380 550 L560 490 L760 545 L950 500 L1150 550 L1350 505 L1600 545 L1600 640 L0 640 Z" fill="#171009" opacity="0.95"/>

  <!-- town hall block (right) -->
  <g>
    <rect x="1120" y="300" width="360" height="300" fill="url(#bldg1)"/>
    <rect x="1120" y="300" width="360" height="300" fill="#000" opacity="0.18"/>
    <polygon points="1090,300 1300,210 1510,300" fill="#241c15"/>
    <rect x="1258" y="212" width="84" height="88" fill="#1a1410"/>
    <polygon points="1258,212 1300,168 1342,212" fill="#332619"/>
    <rect x="1304" y="228" width="30" height="30" fill="url(#windowGlow)"/>
    <rect x="1304" y="228" width="30" height="30" fill="url(#windowGlow)" filter="url(#soft8)"/>
    <rect x="1140" y="336" width="42" height="58" fill="url(#windowGlow)" opacity="0.85"/>
    <rect x="1208" y="336" width="42" height="58" fill="url(#windowGlow)" opacity="0.6"/>
    <rect x="1408" y="336" width="42" height="58" fill="url(#windowGlow)" opacity="0.7"/>
    <rect x="1160" y="470" width="66" height="130" rx="4" fill="#4a2c16"/>
    <circle cx="1212" cy="536" r="4" fill="#e8a04c"/>
  </g>

  <!-- tavern block (left) -->
  <g>
    <rect x="120" y="330" width="420" height="280" fill="url(#bldg2)"/>
    <polygon points="90,330 330,218 570,330" fill="#2e2218"/>
    <rect x="150" y="378" width="54" height="70" fill="url(#windowGlow)" opacity="0.9"/>
    <rect x="150" y="378" width="54" height="70" fill="url(#windowGlow)" filter="url(#soft8)"/>
    <rect x="240" y="378" width="54" height="70" fill="url(#windowGlow)" opacity="0.65"/>
    <rect x="432" y="378" width="54" height="70" fill="url(#windowGlow)" opacity="0.5"/>
    <rect x="260" y="492" width="84" height="118" rx="4" fill="#3a2413"/>
    <path d="M340 640 Q420 560 520 640" stroke="#1a1008" stroke-width="22" fill="none"/>
  </g>

  <!-- chimney smoke -->
  <g opacity="0.35">
    <path d="M360 190 q30 -70 -10 -140 q20 -50 60 -80" stroke="#cbb89a" stroke-width="26" fill="none" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M398 160 q40 -60 20 -120 q30 -40 70 -60" stroke="#cbb89a" stroke-width="20" fill="none" stroke-linecap="round" filter="url(#soft)"/>
  </g>

  <!-- market stalls -->
  <g>
    <rect x="700" y="470" width="150" height="130" fill="#241a10"/>
    <rect x="680" y="430" width="190" height="40" fill="url(#awning)"/>
    <path d="M680 470 l16 -16 16 16 16 -16 16 16 16 -16 16 16 16 -16 16 16 16 -16 16 16 16 -16 16 16" stroke="#6b2c18" stroke-width="3" fill="none"/>
    <circle cx="730" cy="540" r="14" fill="#c96f2f"/>
    <circle cx="770" cy="548" r="12" fill="#a05a28"/>
    <circle cx="810" cy="538" r="13" fill="#b8642e"/>
    <rect x="700" y="572" width="150" height="28" fill="#3a2c1c"/>
  </g>
  <g>
    <rect x="920" y="500" width="130" height="100" fill="#241a10"/>
    <rect x="902" y="462" width="166" height="38" fill="url(#awning)"/>
    <path d="M902 500 l14 -14 14 14 14 -14 14 14 14 -14 14 14 14 -14 14 14 14 -14 14 14 14 -14 14 14" stroke="#6b2c18" stroke-width="3" fill="none"/>
    <rect x="940" y="544" width="46" height="26" rx="3" fill="#8a5a2a"/>
    <rect x="992" y="548" width="40" height="22" rx="3" fill="#6b4320"/>
  </g>

  <!-- ground plaza -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#ground)"/>
  <g stroke="#4a3a28" stroke-width="3" opacity="0.7">
    <path d="M0 680 H1600 M0 740 H1600 M0 810 H1600"/>
    <path d="M160 640 V740 M420 640 V810 M660 640 V740 M880 640 V810 M1120 640 V740 M1380 640 V810"/>
    <path d="M520 740 V810 M1040 740 V810"/>
  </g>
  <ellipse cx="800" cy="900" rx="700" ry="120" fill="#000" opacity="0.4"/>

  <!-- street lamps -->
  <g>
    <rect x="626" y="380" width="10" height="250" fill="#241c15"/>
    <rect x="606" y="376" width="50" height="10" rx="5" fill="#241c15"/>
    <circle cx="618" cy="380" r="30" fill="url(#lampGlow)"/>
    <circle cx="600" cy="374" r="12" fill="#f5c77a"/>
    <circle cx="600" cy="374" r="5" fill="#fff2d0"/>
  </g>
  <g>
    <rect x="1026" y="410" width="10" height="220" fill="#241c15"/>
    <rect x="1006" y="406" width="50" height="10" rx="5" fill="#241c15"/>
    <circle cx="1018" cy="410" r="30" fill="url(#lampGlow)"/>
    <circle cx="1000" cy="404" r="12" fill="#f5c77a"/>
    <circle cx="1000" cy="404" r="5" fill="#fff2d0"/>
  </g>

  <!-- ash motes -->
  <g fill="#e8a04c">
    <circle cx="180" cy="300" r="2.4" opacity="0.8"/><circle cx="420" cy="240" r="1.8" opacity="0.6"/>
    <circle cx="560" cy="320" r="2" opacity="0.7"/><circle cx="760" cy="270" r="1.6" opacity="0.5"/>
    <circle cx="900" cy="360" r="2.6" opacity="0.8"/><circle cx="1150" cy="280" r="1.8" opacity="0.6"/>
    <circle cx="1320" cy="380" r="2.2" opacity="0.7"/><circle cx="1460" cy="250" r="1.5" opacity="0.5"/>
    <circle cx="240" cy="470" r="2" opacity="0.6"/><circle cx="640" cy="440" r="1.7" opacity="0.5"/>
    <circle cx="1080" cy="470" r="2.3" opacity="0.7"/><circle cx="1520" cy="520" r="1.9" opacity="0.6"/>
    <circle cx="70" cy="560" r="1.6" opacity="0.5"/><circle cx="330" cy="620" r="2" opacity="0.7"/>
    <circle cx="760" cy="700" r="1.8" opacity="0.5"/><circle cx="1230" cy="760" r="2" opacity="0.6"/>
  </g>

  <!-- warm vignette -->
  <rect width="1600" height="900" fill="none" stroke="#1c0f06" stroke-width="220" opacity="0.55"/>
</svg>
