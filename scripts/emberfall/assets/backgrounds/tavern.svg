<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="灰烬酒馆：炉火、铜管与满墙酒瓶的暖黄内景">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a12"/>
      <stop offset="1" stop-color="#171009"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a18"/>
      <stop offset="1" stop-color="#1c130a"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb45e" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#e8823a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e8823a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2c07a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f2c07a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff7a2a"/>
      <stop offset="0.55" stop-color="#ffb45e"/>
      <stop offset="1" stop-color="#ffe0a0"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8a2c10"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a06a30"/>
      <stop offset="0.5" stop-color="#7a4a20"/>
      <stop offset="1" stop-color="#55331a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="soft6" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <circle cx="400" cy="680" r="430" fill="url(#fireGlow)"/>
  <circle cx="820" cy="180" r="260" fill="url(#lampGlow)" opacity="0.8"/>
  <circle cx="1260" cy="180" r="260" fill="url(#lampGlow)" opacity="0.8"/>

  <!-- timber beams -->
  <g fill="#33241a">
    <rect x="0" y="90" width="1600" height="26"/>
    <rect x="0" y="330" width="1600" height="16" opacity="0.6"/>
    <rect x="200" y="60" width="26" height="300"/>
    <rect x="640" y="60" width="26" height="300"/>
    <rect x="1060" y="60" width="26" height="300"/>
    <rect x="1440" y="60" width="26" height="300"/>
  </g>
  <path d="M0 78 L1600 34 L1600 66 L0 110 Z" fill="#1a120c"/>

  <!-- ceiling lamps -->
  <g>
    <path d="M820 120 V170" stroke="#c9a36a" stroke-width="3"/>
    <path d="M780 170 q40 44 80 0" fill="#c9a36a"/>
    <circle cx="820" cy="182" r="12" fill="#f2c07a"/>
    <circle cx="820" cy="182" r="5" fill="#fff2d0"/>
  </g>
  <g>
    <path d="M1260 120 V170" stroke="#c9a36a" stroke-width="3"/>
    <path d="M1220 170 q40 44 80 0" fill="#c9a36a"/>
    <circle cx="1260" cy="182" r="12" fill="#f2c07a"/>
    <circle cx="1260" cy="182" r="5" fill="#fff2d0"/>
  </g>

  <!-- back bar: shelves + bottles -->
  <rect x="420" y="240" width="760" height="470" fill="#2a1c12"/>
  <rect x="450" y="270" width="700" height="16" fill="#4a3a28"/>
  <rect x="450" y="380" width="700" height="16" fill="#4a3a28"/>
  <rect x="450" y="490" width="700" height="16" fill="#4a3a28"/>
  <g>
    <rect x="480" y="220" width="34" height="50" rx="5" fill="#8a3c22"/>
    <rect x="494" y="212" width="6" height="10" fill="#5a2c1a"/>
    <rect x="530" y="232" width="30" height="38" rx="4" fill="#5f7a3c"/>
    <rect x="541" y="224" width="8" height="10" fill="#3a4a24"/>
    <rect x="578" y="218" width="36" height="52" rx="5" fill="#7a5a20"/>
    <rect x="592" y="210" width="8" height="10" fill="#4a3a14"/>
    <rect x="628" y="226" width="28" height="44" rx="4" fill="#8a3c22"/>
    <rect x="670" y="218" width="38" height="52" rx="5" fill="#4a5a7a"/>
    <rect x="684" y="210" width="8" height="10" fill="#2c3a52"/>
  </g>
  <g>
    <rect x="480" y="330" width="32" height="50" rx="5" fill="#6b4a2a"/>
    <rect x="526" y="340" width="28" height="40" rx="4" fill="#8a3c22"/>
    <rect x="566" y="330" width="36" height="50" rx="5" fill="#5f7a3c"/>
    <rect x="616" y="340" width="30" height="40" rx="4" fill="#7a5a20"/>
    <rect x="660" y="332" width="32" height="48" rx="5" fill="#4a5a7a"/>
    <rect x="706" y="338" width="30" height="42" rx="4" fill="#8a3c22"/>
  </g>
  <g>
    <rect x="480" y="440" width="34" height="50" rx="5" fill="#7a5a20"/>
    <rect x="528" y="450" width="28" height="40" rx="4" fill="#4a5a7a"/>
    <rect x="570" y="440" width="34" height="50" rx="5" fill="#8a3c22"/>
    <rect x="620" y="450" width="28" height="40" rx="4" fill="#6b4a2a"/>
    <rect x="660" y="442" width="32" height="48" rx="5" fill="#5f7a3c"/>
  </g>
  <!-- kegs -->
  <g>
    <ellipse cx="1060" cy="640" rx="60" ry="24" fill="#55331a"/>
    <rect x="1000" y="588" width="120" height="52" rx="14" fill="url(#pipe)"/>
    <ellipse cx="1060" cy="588" rx="60" ry="24" fill="#8a5a2a"/>
    <ellipse cx="1060" cy="590" rx="44" ry="16" fill="#6b4320"/>
  </g>

  <!-- copper pipes -->
  <g stroke="url(#pipe)" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M420 560 H300 V660"/>
    <path d="M1180 560 H1330 V430"/>
  </g>
  <g fill="#c9a36a">
    <circle cx="300" cy="560" r="16"/>
    <circle cx="420" cy="560" r="16"/>
    <circle cx="1330" cy="430" r="16"/>
  </g>
  <g opacity="0.4">
    <path d="M280 560 q30 -50 20 -90" stroke="#e8dcc8" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#soft6)"/>
  </g>

  <!-- fireplace -->
  <g>
    <rect x="180" y="500" width="440" height="30" fill="#4a3a28"/>
    <rect x="140" y="530" width="520" height="190" fill="#33241a"/>
    <rect x="140" y="530" width="520" height="190" fill="none" stroke="#1a120c" stroke-width="10"/>
    <path d="M250 720 Q400 470 550 720 Z" fill="#120a06"/>
    <path d="M262 712 Q400 480 538 712 Z" fill="#1e1208"/>
    <!-- logs -->
    <rect x="330" y="652" width="150" height="26" rx="12" fill="#4a2c16" transform="rotate(-8 405 665)"/>
    <rect x="300" y="676" width="180" height="26" rx="12" fill="#3a2410" transform="rotate(6 390 689)"/>
    <!-- flames -->
    <path d="M360 655 Q340 590 395 540 Q375 590 410 565 Q415 520 450 500 Q440 550 470 560 Q505 540 500 590 Q470 575 455 610 Q445 640 440 660 Z" fill="url(#flame)" opacity="0.92"/>
    <path d="M395 660 Q380 620 410 590 Q420 610 430 600 Q435 575 450 570 Q445 600 455 615 Q460 640 445 660 Z" fill="url(#flameCore)" opacity="0.85"/>
    <circle cx="400" cy="620" r="120" fill="#ff9a3c" opacity="0.14" filter="url(#soft)"/>
    <!-- mantle ornaments -->
    <rect x="196" y="470" width="24" height="60" rx="4" fill="#8a5a2a"/>
    <rect x="580" y="470" width="24" height="60" rx="4" fill="#8a5a2a"/>
    <path d="M205 480 l14 -6 14 6 -14 6 Z" fill="#c9a36a"/>
  </g>

  <!-- tables & stools -->
  <g>
    <ellipse cx="980" cy="760" rx="150" ry="34" fill="#55331a"/>
    <rect x="860" y="720" width="240" height="14" rx="6" fill="#6b4320"/>
    <rect x="900" y="734" width="14" height="66" fill="#4a2c16"/>
    <rect x="1046" y="734" width="14" height="66" fill="#4a2c16"/>
    <circle cx="920" cy="740" r="10" fill="#c96f2f"/>
    <circle cx="1000" cy="748" r="9" fill="#a05a28"/>
  </g>
  <g>
    <ellipse cx="1320" cy="790" rx="120" ry="28" fill="#55331a"/>
    <rect x="1220" y="756" width="200" height="12" rx="6" fill="#6b4320"/>
    <rect x="1250" y="768" width="12" height="56" fill="#4a2c16"/>
    <rect x="1378" y="768" width="12" height="56" fill="#4a2c16"/>
  </g>

  <!-- floor -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#floor)"/>
  <g stroke="#4a3a28" stroke-width="3" opacity="0.6">
    <path d="M0 740 H1600 M0 800 H1600 M0 870 H1600"/>
    <path d="M120 700 V870 M400 700 V870 M720 700 V870 M1040 700 V870 M1360 700 V870"/>
  </g>
  <ellipse cx="800" cy="920" rx="760" ry="90" fill="#000" opacity="0.55"/>
</svg>
