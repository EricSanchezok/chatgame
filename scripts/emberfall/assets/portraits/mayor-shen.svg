<svg xmlns="http://www.w3.org/2000/svg" width="512" height="768" viewBox="0 0 512 768" role="img" aria-label="沈镇长：白面长袍、滴水不漏的镇长">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a30"/>
      <stop offset="0.6" stop-color="#24241e"/>
      <stop offset="1" stop-color="#12120f"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#c9c2a8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c9c2a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d4b4"/>
      <stop offset="1" stop-color="#c8ae88"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c2a8"/>
      <stop offset="1" stop-color="#8f8a74"/>
    </linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5238"/>
      <stop offset="1" stop-color="#38332a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="512" height="768" rx="28" fill="url(#bg)"/>
  <circle cx="256" cy="250" r="300" fill="url(#bgGlow)"/>
  <!-- faint seal stamp in background -->
  <g opacity="0.1">
    <rect x="356" y="520" width="86" height="86" rx="10" fill="none" stroke="#e8a04c" stroke-width="6"/>
    <rect x="368" y="532" width="62" height="62" rx="6" fill="none" stroke="#e8a04c" stroke-width="3"/>
    <path d="M380 570 h38 M380 578 h30 M380 586 h36" stroke="#e8a04c" stroke-width="3"/>
  </g>

  <!-- torso -->
  <path d="M104 768 Q100 566 158 484 Q192 428 256 416 Q320 428 354 484 Q412 566 412 768 Z" fill="url(#robe)"/>
  <path d="M104 768 Q100 566 158 484 Q192 428 256 416 L256 768 Z" fill="#6b6752" opacity="0.45"/>
  <!-- vest -->
  <path d="M186 480 Q256 452 326 480 L338 660 Q256 690 174 660 Z" fill="url(#vest)"/>
  <path d="M186 480 Q256 452 326 480 L316 512 Q256 488 196 512 Z" fill="#6b6144" opacity="0.6"/>
  <!-- frog buttons -->
  <g stroke="#c9a36a" stroke-width="4" fill="none">
    <path d="M196 512 q10 12 24 2 M316 512 q-10 12 -24 2"/>
    <path d="M196 566 q10 12 24 2 M316 566 q-10 12 -24 2"/>
    <path d="M196 620 q10 12 24 2 M316 620 q-10 12 -24 2"/>
  </g>
  <!-- jade pendant -->
  <path d="M240 638 q16 10 32 0 l-6 22 q-10 8 -20 0 Z" fill="#3f7d44"/>
  <path d="M240 638 q16 10 32 0" stroke="#c9a36a" stroke-width="3" fill="none"/>
  <!-- sleeve cuffs -->
  <path d="M150 500 Q128 560 132 620 Q152 640 172 618 Q180 566 176 506 Z" fill="#a8a28c"/>
  <path d="M362 500 Q384 560 380 620 Q360 640 340 618 Q332 566 336 506 Z" fill="#a8a28c"/>
  <!-- hands clasped -->
  <g>
    <path d="M170 600 Q186 580 202 592 Q196 616 182 622 Q168 616 170 600 Z" fill="url(#skin)"/>
    <path d="M342 600 Q326 580 310 592 Q316 616 330 622 Q344 616 342 600 Z" fill="url(#skin)"/>
    <ellipse cx="256" cy="612" rx="56" ry="20" fill="url(#skin)"/>
    <path d="M220 604 Q256 592 292 604" stroke="#a88a62" stroke-width="4" fill="none"/>
  </g>

  <!-- neck -->
  <path d="M226 400 Q256 392 286 400 L292 444 Q256 462 220 444 Z" fill="url(#skin)"/>
  <!-- mandarin collar -->
  <path d="M196 452 Q256 428 316 452 L310 476 Q256 456 202 476 Z" fill="#5a5238"/>
  <path d="M196 452 Q256 428 316 452 L310 462 Q256 442 202 462 Z" fill="#7a7050"/>

  <!-- head -->
  <ellipse cx="256" cy="272" rx="84" ry="98" fill="url(#skin)"/>
  <path d="M256 174 Q298 174 312 198 Q326 222 324 250 Q320 300 294 328 Q276 350 256 352 Q236 350 218 328 Q192 300 188 250 Q186 222 200 198 Q214 174 256 174 Z" fill="url(#skin)"/>

  <!-- placid brow -->
  <path d="M200 244 Q256 234 312 244 Q312 252 256 254 Q200 252 200 244 Z" fill="#b89668" opacity="0.4"/>

  <!-- eyes: calm, unreadable -->
  <g>
    <path d="M202 262 Q218 254 234 262" stroke="#2c2010" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M278 262 Q294 254 310 262" stroke="#2c2010" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="218" cy="262" r="6" fill="#302214"/>
    <circle cx="294" cy="262" r="6" fill="#302214"/>
    <circle cx="220" cy="260" r="2" fill="#f0e8d0"/>
    <circle cx="296" cy="260" r="2" fill="#f0e8d0"/>
  </g>
  <!-- long scholar brows -->
  <path d="M194 248 Q210 240 232 246" stroke="#4a4234" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M280 246 Q302 240 318 248" stroke="#4a4234" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M256 274 Q250 292 246 302 Q256 308 266 302 Q262 292 256 274 Z" fill="#d8bc94" opacity="0.9"/>
  <path d="M256 306 Q250 310 246 304" stroke="#a88a62" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- thin composed mouth -->
  <path d="M234 330 Q256 334 278 330" stroke="#8a5c42" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M208 322 Q220 318 230 320" stroke="#8a5c42" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M282 320 Q292 318 304 322" stroke="#8a5c42" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- short goatee -->
  <path d="M244 340 Q256 344 268 340 Q272 354 262 362 Q256 366 250 362 Q240 354 244 340 Z" fill="#3a3024"/>

  <!-- ears -->
  <path d="M172 274 Q158 272 156 292 Q160 308 176 308 Z" fill="url(#skin)"/>
  <path d="M340 274 Q354 272 356 292 Q352 308 336 308 Z" fill="url(#skin)"/>

  <!-- official cap -->
  <g>
    <path d="M164 236 Q164 176 256 168 Q348 176 348 236 Q348 248 322 248 Q296 254 256 254 Q216 254 190 248 Q164 248 164 236 Z" fill="#38332a"/>
    <path d="M164 236 Q256 264 348 236 L348 248 Q256 274 164 248 Z" fill="#241f18"/>
    <path d="M174 228 Q256 254 338 228" stroke="#c9a36a" stroke-width="5" fill="none"/>
    <rect x="228" y="196" width="56" height="14" rx="5" fill="#c9a36a"/>
    <circle cx="256" cy="203" r="8" fill="#e8a04c"/>
    <circle cx="256" cy="203" r="4" fill="#f5cf8a"/>
  </g>
</svg>
