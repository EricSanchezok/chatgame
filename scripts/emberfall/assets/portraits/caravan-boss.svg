<svg xmlns="http://www.w3.org/2000/svg" width="512" height="768" viewBox="0 0 512 768" role="img" aria-label="马掌柜：商队领队，宽肩皮裘与算盘">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2c16"/>
      <stop offset="0.6" stop-color="#2c1c10"/>
      <stop offset="1" stop-color="#16100a"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#e8a04c" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#e8a04c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a878"/>
      <stop offset="1" stop-color="#a8744c"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6b4a"/>
      <stop offset="1" stop-color="#5a4328"/>
    </linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a3c20"/>
      <stop offset="1" stop-color="#4a2413"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="512" height="768" rx="28" fill="url(#bg)"/>
  <circle cx="256" cy="250" r="300" fill="url(#bgGlow)"/>
  <!-- trade-route map glyph -->
  <g stroke="#c9a36a" stroke-width="3" opacity="0.14" fill="none" stroke-linecap="round">
    <path d="M80 140 h60 l30 -30 h40 M80 140 l26 34 h40 l20 -16"/>
    <circle cx="96" cy="140" r="6" fill="#c9a36a"/><circle cx="216" cy="144" r="6" fill="#c9a36a"/>
    <path d="M336 596 h40 l20 26 h40 M336 596 l24 -30 h44"/>
    <circle cx="346" cy="596" r="6" fill="#c9a36a"/><circle cx="452" cy="592" r="6" fill="#c9a36a"/>
  </g>

  <!-- broad torso: fur-trimmed coat -->
  <path d="M88 768 Q84 566 148 482 Q186 424 256 412 Q326 424 364 482 Q428 566 428 768 Z" fill="url(#fur)"/>
  <path d="M88 768 Q84 566 148 482 Q186 424 256 412 L256 768 Z" fill="#3a2c1a" opacity="0.5"/>
  <!-- inner vest -->
  <path d="M196 470 Q256 448 316 470 L330 640 Q256 672 182 640 Z" fill="url(#vest)"/>
  <path d="M196 470 Q256 448 316 470 L306 502 Q256 482 206 502 Z" fill="#8f4a28" opacity="0.6"/>
  <!-- brass toggle buttons -->
  <g>
    <circle cx="256" cy="514" r="8" fill="#c9a36a"/>
    <circle cx="256" cy="564" r="8" fill="#c9a36a"/>
    <circle cx="256" cy="614" r="8" fill="#c9a36a"/>
    <path d="M240 514 h32 M240 564 h32 M240 614 h32" stroke="#e8a04c" stroke-width="3" opacity="0.7"/>
  </g>
  <!-- fur collar -->
  <path d="M150 476 Q196 428 256 424 Q316 428 362 476 Q352 500 332 504 Q296 520 256 520 Q216 520 180 504 Q160 500 150 476 Z" fill="#a88a60"/>
  <path d="M150 476 Q196 428 256 424 Q316 428 362 476 Q350 492 334 496 Q300 512 256 512 Q212 512 178 496 Q162 492 150 476 Z" fill="#c9a878" opacity="0.6"/>
  <g stroke="#8a6b4a" stroke-width="3" fill="none" opacity="0.8">
    <path d="M166 486 q10 -6 22 -4 M190 474 q12 -8 26 -6 M216 466 q12 -8 26 -4 M248 462 q10 -8 24 -2 M282 464 q12 -8 26 -2 M308 472 q12 -8 26 -4 M330 486 q10 -6 20 -4"/>
  </g>

  <!-- neck (thick) -->
  <path d="M214 396 Q256 386 298 396 L308 448 Q256 470 204 448 Z" fill="url(#skin)"/>
  <path d="M228 434 Q256 446 284 434 Q280 456 256 458 Q232 456 228 434 Z" fill="#7a5230" opacity="0.6"/>

  <!-- head: round, jovial -->
  <ellipse cx="256" cy="266" rx="90" ry="102" fill="url(#skin)"/>
  <path d="M256 164 Q304 164 322 192 Q338 220 336 252 Q332 306 302 336 Q280 362 256 364 Q232 362 210 336 Q180 306 176 252 Q174 220 190 192 Q208 164 256 164 Z" fill="url(#skin)"/>

  <!-- broad grin lines -->
  <g stroke="#8a5a38" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M186 320 q16 10 34 12"/>
    <path d="M292 332 q16 -10 34 -12"/>
  </g>

  <!-- eyes: shrewd, smiling -->
  <g>
    <path d="M196 260 Q214 248 234 260 Q214 270 196 260 Z" fill="#2c1a10"/>
    <path d="M278 260 Q298 248 316 260 Q298 270 278 260 Z" fill="#2c1a10"/>
    <circle cx="216" cy="260" r="5" fill="#1c1008"/>
    <circle cx="296" cy="260" r="5" fill="#1c1008"/>
    <circle cx="218" cy="258" r="1.8" fill="#f0e0c0"/>
    <circle cx="298" cy="258" r="1.8" fill="#f0e0c0"/>
    <path d="M186 240 q10 -8 24 -6 M266 236 q10 -8 24 -6" stroke="#6b4a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- thick brows -->
  <path d="M190 240 Q214 228 240 238" stroke="#3a2c1a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M272 238 Q298 228 322 240" stroke="#3a2c1a" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- broad nose -->
  <path d="M256 272 Q248 292 242 304 Q252 312 264 308 Q266 292 256 272 Z" fill="#b8845a" opacity="0.9"/>
  <path d="M254 308 Q250 312 246 306" stroke="#8a5a38" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- open smile -->
  <path d="M222 326 Q256 352 290 326 Q282 344 256 348 Q230 344 222 326 Z" fill="#5a2415"/>
  <path d="M234 330 Q256 348 278 330 Q272 342 256 344 Q240 342 234 330 Z" fill="#e8dcc0"/>
  <!-- mustache -->
  <path d="M214 318 Q238 326 256 324 Q274 326 298 318 Q290 336 256 340 Q222 336 214 318 Z" fill="#241a10"/>

  <!-- ears -->
  <path d="M166 268 Q152 266 150 286 Q154 302 170 302 Z" fill="url(#skin)"/>
  <path d="M346 268 Q360 266 362 286 Q358 302 342 302 Z" fill="url(#skin)"/>

  <!-- queue hair + skullcap -->
  <path d="M164 236 Q162 158 256 148 Q350 158 348 236 Q348 190 322 164 Q304 148 284 144 Q256 140 228 144 Q208 148 190 164 Q164 190 164 236 Z" fill="#241a10"/>
  <path d="M164 236 Q256 260 348 236 Q348 210 332 192 Q308 170 284 164 Q256 158 228 164 Q204 170 180 192 Q164 210 164 236 Z" fill="#3a2c1a"/>
  <path d="M172 224 Q256 252 340 224" stroke="#c9a36a" stroke-width="5" fill="none"/>
  <rect x="232" y="196" width="48" height="12" rx="5" fill="#c9a36a"/>
  <circle cx="256" cy="202" r="6" fill="#e8a04c"/>
  <!-- queue braid -->
  <path d="M256 148 Q272 160 268 190 Q260 220 236 232 Q212 238 196 246 Q188 252 192 258 Q210 248 228 240 Q248 228 256 214 Q252 184 256 148 Z" fill="#241a10" opacity="0.9"/>
  <path d="M196 246 Q186 254 192 262 Q208 252 224 244" stroke="#c9a36a" stroke-width="3" fill="none"/>

  <!-- abacus at waist -->
  <g>
    <rect x="120" y="600" width="96" height="120" rx="10" fill="#6b4320" stroke="#c9a36a" stroke-width="5"/>
    <rect x="130" y="610" width="76" height="100" rx="6" fill="#4a2c16"/>
    <path d="M138 626 h80 M138 650 h80 M138 674 h80 M138 698 h80" stroke="#c9a36a" stroke-width="4"/>
    <g fill="#e8a04c">
      <circle cx="152" cy="626" r="6"/><circle cx="170" cy="626" r="6"/><circle cx="188" cy="626" r="6"/>
      <circle cx="148" cy="650" r="6"/><circle cx="166" cy="650" r="6"/><circle cx="184" cy="650" r="6"/><circle cx="202" cy="650" r="6"/>
      <circle cx="158" cy="674" r="6"/><circle cx="176" cy="674" r="6"/>
      <circle cx="150" cy="698" r="6"/><circle cx="168" cy="698" r="6"/><circle cx="186" cy="698" r="6"/>
    </g>
    <g fill="#6b4320">
      <circle cx="188" cy="674" r="6"/><circle cx="202" cy="674" r="6"/><circle cx="202" cy="698" r="6"/>
    </g>
  </g>

  <!-- embers -->
  <g fill="#e8a04c">
    <circle cx="84" cy="240" r="3.6" opacity="0.7"/><circle cx="430" cy="200" r="3" opacity="0.55"/>
    <circle cx="60" cy="520" r="3.2" opacity="0.6"/><circle cx="448" cy="480" r="3.6" opacity="0.65"/>
  </g>
</svg>
