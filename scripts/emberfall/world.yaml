background: 灰烬镇靠一座公共熔炉过冬。矿工按鼓钟下井，掌灯人记录每块煤、每根支柱与每份证词；矿层里的青白灰火不会说话，却会把被改写的班账照出来。
rules:
  - id: witnessed-accounting
    text: 炉煤、灯火与支护由班账守恒，结算不得重复。
    mechanism: shift-discipline
  - id: paired-evidence
    text: 任何事故结论都需要实物与证词两类独立来源互证。
    mechanism: shift-discipline
taboos:
  - { id: no-free-coal, text: 煤不得在叙事中凭空增减, severity: hard }
  - { id: no-modern-tech, text: 不出现电力与现代机械, severity: hard }
glossary:
  - { term: 灰灯, aliases: [公灯], definition: 全镇共用的青白矿灯，由掌灯人保管并记账。 }
  - { term: 鼓钟, aliases: [班钟], definition: 井上击鼓、井下应钟的轮班报时规矩。 }
  - { term: 见证账, aliases: [班账], definition: 同时记录资源、事故实物与证词来源的公共账册。 }
