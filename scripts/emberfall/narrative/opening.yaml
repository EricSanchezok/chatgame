scene: 你睁开眼，灰烬镇的清晨雾气未散，远处矿山的黑色轮廓像一道旧伤疤。街上的蒸汽管道低鸣着吐出白汽，炉膛里的火与法阵的光在灰蒙蒙的天光里明灭不定。
first_lines:
  - 酒馆老板娘艾拉正擦着杯子，抬头看了你一眼。
  - 风卷起地面的灰烬，在石板路上打了个旋。
hooks:
  - text: 你是这里的熟客，镇上人都认得你。
    condition: { all: [{ source: flag, key: returned-visitor, op: has }] }
  - text: 你初来乍到，灰烬镇的一切都要从头打听。
    condition: { all: [{ source: flag, key: returned-visitor, op: not_has }] }
