id: escort-caravan
name: 护送商队
objective:
  type: escort
  target:
    pool: [caravan-boss]
  quantity: 1
giver:
  pool: [mayor-shen]
conditions:
  all:
    - { source: reputation, key: town-office, op: gte, value: 20 }
rewards:
  - { kind: currency, direction: add, target: player, value: 30 }
repeatable: true
cooldown: 7
time_limit: { days: 2 }
narrative:
  offer: 沈镇长招手让你上前："商队要过灰林，缺个认得路的。走一趟，镇公所出三十个金币。"
  complete: 商队平安到站，马掌柜拍着你的肩大笑。
  fail: 商队等不及先走了，酬劳自然作罢。
