id: escort-sample
name: 护送辐射样本
objective:
  type: escort
  target:
    any: true
  quantity: 1
giver:
  pool: [doctor-vera]
  condition:
    all:
      - { source: reputation, key: station-committee, op: gte, value: 20 }
rewards:
  - { kind: currency, direction: add, target: player, value: 50 }
  - { kind: reputation, direction: add, target: player, faction: station-committee, value: 15 }
  - { kind: flag, direction: set, target: player, flag: sample-escorted }
repeatable: false
cooldown: 7
time_limit: { days: 1 }
narrative:
  offer: "维拉把铅封样本箱推到你面前：'把这箱东西送到反应堆层的检测台，路上别摔。'"
  complete: "样本箱稳稳落在检测台上，维拉在通讯里说了声谢谢。"
  fail: "样本箱在途中受损，维拉不得不重新取样。"
