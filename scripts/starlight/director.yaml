tension:
  variables:
    - { name: audit-heat, source: threat_gauge, min: 0, max: 100, initial: 12 }
event_selection:
  policy: weighted_by_band
  bands:
    - { band: [0, 30], weight_multiplier: 0.5 }
    - { band: [30, 70], weight_multiplier: 1.0 }
    - { band: [70, 100], weight_multiplier: 1.3 }
pacing: { crisis_density: 0.15, breather_min_interval: 3, difficulty_ramp: 0.02 }
novelty: { seen_tracking: true, cooldown_default: 7 }
