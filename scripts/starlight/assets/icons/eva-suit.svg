<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="舱外服：带面罩的 EVA 宇航服">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c30"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe4f5"/>
      <stop offset="1" stop-color="#8494b3"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6f4ff"/>
      <stop offset="0.5" stop-color="#4f7dff"/>
      <stop offset="1" stop-color="#1c3a8a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="17" fill="none" stroke="#273148" stroke-width="2" opacity="0.6"/>
  <g>
    <!-- helmet -->
    <circle cx="64" cy="42" r="24" fill="url(#suit)" stroke="#5a6a8a" stroke-width="3"/>
    <path d="M46 38 Q64 26 82 38 Q82 58 64 62 Q46 58 46 38 Z" fill="url(#visor)" stroke="#5a6a8a" stroke-width="3"/>
    <path d="M54 40 Q60 34 66 40" stroke="#d6f4ff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- torso -->
    <path d="M38 78 Q64 66 90 78 L92 100 Q64 108 36 100 Z" fill="url(#suit)" stroke="#5a6a8a" stroke-width="3"/>
    <rect x="52" y="80" width="24" height="18" rx="3" fill="#4f7dff" opacity="0.8"/>
    <circle cx="70" cy="90" r="4" fill="#d6f4ff"/>
    <circle cx="80" cy="90" r="4" fill="#4fd08a"/>
    <!-- chest light -->
    <circle cx="64" cy="88" r="3" fill="#d6f4ff"/>
    <!-- backpack -->
    <rect x="94" y="60" width="12" height="36" rx="5" fill="#5a6a8a"/>
    <!-- arms -->
    <path d="M38 78 L22 96 M90 78 L106 96" stroke="url(#suit)" stroke-width="14" stroke-linecap="round"/>
    <path d="M38 78 L22 96 M90 78 L106 96" stroke="#5a6a8a" stroke-width="14" stroke-linecap="round" fill="none" opacity="0"/>
    <circle cx="22" cy="96" r="8" fill="#8494b3"/>
    <circle cx="106" cy="96" r="8" fill="#8494b3"/>
    <!-- oxygen hoses -->
    <path d="M54 66 Q40 60 44 78" stroke="#4f7dff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M74 66 Q88 60 84 78" stroke="#4f7dff" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
