    <g fill="#c9d4e8">
      <rect x="34" y="96" width="6" height="10" rx="1"/><rect x="46" y="96" width="6" height="10" rx="1"/>
      <rect x="58" y="96" width="6" height="10" rx="1"/><rect x="70" y="96" width="6" height="10" rx="1"/>
      <rect x="82" y="96" width="6" height="10" rx="1"/><rect x="94" y="96" width="6" height="10" rx="1"/>
    </g>
