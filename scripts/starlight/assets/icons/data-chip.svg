<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="数据芯片">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c30"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3a5a"/>
      <stop offset="1" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ea2ff"/>
      <stop offset="0.5" stop-color="#4f7dff"/>
      <stop offset="1" stop-color="#1c3a8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5f9fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5f9fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="17" fill="none" stroke="#273148" stroke-width="2" opacity="0.6"/>
  <g>
    <rect x="26" y="30" width="76" height="66" rx="8" fill="url(#chip)" stroke="#4f7dff" stroke-width="3"/>
    <rect x="36" y="40" width="56" height="46" rx="5" fill="#0d1424"/>
    <path d="M36 40 h56 v46 h-56 Z" fill="url(#core)" opacity="0.55"/>
    <circle cx="64" cy="63" r="20" fill="url(#glow)"/>
    <circle cx="64" cy="63" r="10" fill="#d6f4ff"/>
    <circle cx="64" cy="63" r="4" fill="#ffffff"/>
    <g stroke="#7ea2ff" stroke-width="3">
