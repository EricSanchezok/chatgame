<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="维修工具包：万用表与焊枪">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c30"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5a68"/>
      <stop offset="1" stop-color="#2c3844"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#273148"/>
      <stop offset="1" stop-color="#141c30"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="17" fill="none" stroke="#273148" stroke-width="2" opacity="0.6"/>
  <g>
    <!-- case -->
    <path d="M22 56 Q64 48 106 56 L106 92 Q64 102 22 92 Z" fill="url(#case)" stroke="#1c2a4a" stroke-width="3"/>
    <path d="M22 56 Q64 48 106 56 L106 64 Q64 56 22 64 Z" fill="#5a6a7a"/>
    <path d="M28 66 q6 -4 12 0" stroke="#8494b3" stroke-width="3" fill="none"/>
    <!-- multimeter -->
    <rect x="40" y="34" width="34" height="44" rx="5" fill="url(#meter)" stroke="#4f7dff" stroke-width="3"/>
    <path d="M46 58 l8 -8 6 6 8 -10" stroke="#4fd08a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="46" y="68" width="22" height="4" rx="2" fill="#4f7dff" opacity="0.6"/>
    <path d="M48 34 v-8 M58 34 v-8 M66 34 v-8" stroke="#8494b3" stroke-width="3" stroke-linecap="round"/>
    <!-- wrench -->
    <g transform="rotate(-18 90 66)">
      <circle cx="90" cy="66" r="11" fill="none" stroke="#dbe4f5" stroke-width="6"/>
      <rect x="86" y="66" width="8" height="14" rx="3" fill="#dbe4f5"/>
      <rect x="82" y="76" width="16" height="26" rx="4" fill="#c9d4e8"/>
    </g>
    <!-- solder pen -->
    <g transform="rotate(24 100 76)">
      <rect x="96" y="52" width="8" height="26" rx="3" fill="#4a5a68"/>
      <rect x="97" y="48" width="6" height="8" rx="2" fill="#ff8c42"/>
    </g>
  </g>
</svg>
