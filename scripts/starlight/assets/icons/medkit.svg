<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="医疗包：带十字的急救箱">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c30"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe4f5"/>
      <stop offset="1" stop-color="#a8b8d0"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e05a5a"/>
      <stop offset="1" stop-color="#a02c2c"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="17" fill="none" stroke="#273148" stroke-width="2" opacity="0.6"/>
  <g>
    <!-- handle -->
    <path d="M44 34 Q64 24 84 34" stroke="#8494b3" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- case -->
    <rect x="24" y="34" width="80" height="66" rx="8" fill="url(#case)" stroke="#5a6a8a" stroke-width="3"/>
    <rect x="24" y="34" width="80" height="20" rx="8" fill="#c9d4e8" stroke="#5a6a8a" stroke-width="3"/>
    <path d="M24 54 h80" stroke="#5a6a8a" stroke-width="3"/>
    <!-- latch -->
    <rect x="54" y="40" width="20" height="10" rx="4" fill="#8494b3"/>
    <!-- cross -->
    <rect x="50" y="58" width="28" height="36" rx="4" fill="url(#cross)"/>
    <rect x="38" y="70" width="52" height="12" rx="4" fill="url(#cross)"/>
    <path d="M44 64 l20 12 20 -12" stroke="#f0a0a0" stroke-width="4" fill="none" opacity="0.7"/>
  </g>
</svg>
