<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="燃料电池：发光聚变电池">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c30"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c3a5a"/>
      <stop offset="0.5" stop-color="#4a5a7a"/>
      <stop offset="1" stop-color="#1c2844"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd0c8"/>
      <stop offset="1" stop-color="#2a8a84"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd0c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4fd0c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="17" fill="none" stroke="#273148" stroke-width="2" opacity="0.6"/>
  <g>
    <!-- cell body -->
    <rect x="30" y="26" width="68" height="78" rx="10" fill="url(#shell)" stroke="#5a6a8a" stroke-width="3"/>
    <!-- energy window -->
    <rect x="40" y="36" width="48" height="58" rx="6" fill="#0d1424"/>
    <rect x="40" y="36" width="48" height="58" rx="6" fill="url(#energy)" opacity="0.8"/>
    <circle cx="64" cy="65" r="26" fill="url(#glow)"/>
    <circle cx="64" cy="65" r="9" fill="#7ef0e0"/>
    <circle cx="64" cy="65" r="3.5" fill="#eafffb"/>
    <g stroke="#7ef0e0" stroke-width="2" opacity="0.8">
      <path d="M64 48 v6 M64 76 v6 M48 65 h6 M74 65 h6"/>
    </g>
    <!-- top terminal -->
    <rect x="54" y="14" width="20" height="12" rx="4" fill="#8494b3" stroke="#5a6a8a" stroke-width="2"/>
    <rect x="62" y="8" width="4" height="8" fill="#c9d4e8"/>
    <!-- bottom terminal -->
    <rect x="54" y="104" width="20" height="10" rx="4" fill="#8494b3" stroke="#5a6a8a" stroke-width="2"/>
    <!-- rivets -->
    <circle cx="36" cy="34" r="3" fill="#8494b3"/><circle cx="92" cy="34" r="3" fill="#8494b3"/>
    <circle cx="36" cy="96" r="3" fill="#8494b3"/><circle cx="92" cy="96" r="3" fill="#8494b3"/>
  </g>
</svg>
