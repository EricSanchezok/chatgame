<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="废金属：舱壁残片与螺栓">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c30"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5a6a"/>
      <stop offset="1" stop-color="#2a3444"/>
    </linearGradient>
    <linearGradient id="plate2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a5a"/>
      <stop offset="1" stop-color="#1e2636"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="17" fill="none" stroke="#273148" stroke-width="2" opacity="0.6"/>
  <g>
    <!-- big bent plate -->
    <path d="M24 84 L40 34 L84 40 L100 84 Q62 94 24 84 Z" fill="url(#plate)" stroke="#1c2a4a" stroke-width="3"/>
    <path d="M40 34 L84 40 L78 52 L36 44 Z" fill="#5a6a7a"/>
    <path d="M36 60 L74 64" stroke="#8494b3" stroke-width="2" opacity="0.5"/>
    <path d="M40 34 q-4 -10 6 -14" stroke="#1c2a4a" stroke-width="3" fill="none"/>
    <!-- tear -->
    <path d="M60 52 L64 66 L58 70 Z" fill="#0d1424"/>
    <path d="M60 52 L64 66 L58 70" stroke="#4f7dff" stroke-width="2" opacity="0.7" fill="none"/>
    <!-- small plate -->
    <path d="M82 68 L108 76 L100 100 L76 94 Z" fill="url(#plate2)" stroke="#1c2a4a" stroke-width="3"/>
    <!-- bolt -->
    <g transform="rotate(-20 52 96)">
      <circle cx="52" cy="96" r="9" fill="#5a6a7a" stroke="#2c3844" stroke-width="2"/>
      <circle cx="52" cy="96" r="5" fill="none" stroke="#2c3844" stroke-width="2"/>
      <path d="M48 92 h8 M52 88 v8" stroke="#2c3844" stroke-width="2"/>
    </g>
    <!-- nut -->
    <g transform="rotate(12 96 52)">
      <rect x="88" y="44" width="16" height="16" rx="2" fill="#5a6a7a" stroke="#2c3844" stroke-width="2"/>
      <circle cx="96" cy="52" r="4.5" fill="none" stroke="#2c3844" stroke-width="2"/>
    </g>
    <!-- sparks -->
    <path d="M104 60 l2 6 M104 60 l6 2" stroke="#4fd0c8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="30" cy="52" r="2" fill="#4fd0c8" opacity="0.7"/>
  </g>
</svg>
