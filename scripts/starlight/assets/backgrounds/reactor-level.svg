<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="三号反应堆层：橙色冷却辉光与蒸汽">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0806"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb16e" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#ff8c42" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff8c42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coolant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd0c8"/>
      <stop offset="1" stop-color="#2a8a84"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="0.5" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#c85018"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft6" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <circle cx="800" cy="460" r="520" fill="url(#coreGlow)"/>

  <!-- steam vents -->
  <g stroke="#d8c8b0" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.2" filter="url(#soft)">
    <path d="M180 700 q30 -60 10 -120"/>
    <path d="M1420 700 q-30 -60 -10 -120"/>
    <path d="M340 760 q24 -50 8 -100"/>
  </g>

  <!-- gantry deck -->
  <g stroke="#4a2e18" stroke-width="8" fill="none">
    <path d="M0 620 H1600 M0 640 H1600 M0 660 H1600"/>
    <path d="M80 620 V660 M240 620 V660 M400 620 V660 M560 620 V660 M720 620 V660 M880 620 V660 M1040 620 V660 M1200 620 V660 M1360 620 V660 M1520 620 V660"/>
  </g>
  <path d="M0 640 H1600" stroke="#ff8c42" stroke-width="2" opacity="0.25"/>

  <!-- reactor vessel -->
  <g>
    <rect x="640" y="180" width="320" height="420" rx="60" fill="#241608"/>
    <rect x="640" y="180" width="320" height="420" rx="60" fill="none" stroke="#4a2e18" stroke-width="10"/>
    <rect x="672" y="210" width="256" height="330" rx="44" fill="none" stroke="#8a5a2a" stroke-width="5" opacity="0.7"/>
    <path d="M672 250 H928 M672 300 H928 M672 350 H928 M672 400 H928 M672 450 H928 M672 500 H928" stroke="#8a5a2a" stroke-width="4" opacity="0.5"/>
    <!-- core window -->
    <path d="M740 480 Q800 420 860 480 L860 560 Q800 620 740 560 Z" fill="#120600"/>
    <path d="M740 480 Q800 420 860 480 L860 560 Q800 620 740 560 Z" fill="none" stroke="#ff8c42" stroke-width="4"/>
    <ellipse cx="800" cy="520" rx="46" ry="30" fill="url(#core)"/>
    <ellipse cx="800" cy="520" rx="46" ry="30" fill="#ffb16e" opacity="0.5" filter="url(#soft6)"/>
    <ellipse cx="800" cy="520" rx="20" ry="14" fill="#ffe0b0"/>
    <!-- containment bolts -->
    <g fill="#8a5a2a">
      <circle cx="652" cy="200" r="8"/><circle cx="948" cy="200" r="8"/>
      <circle cx="652" cy="580" r="8"/><circle cx="948" cy="580" r="8"/>
      <circle cx="652" cy="390" r="8"/><circle cx="948" cy="390" r="8"/>
    </g>
  </g>

  <!-- coolant pipes -->
  <g stroke="url(#coolant)" stroke-width="22" fill="none" stroke-linecap="round">
    <path d="M120 380 H520 V560 H640"/>
    <path d="M960 560 H1120 V380 H1480"/>
  </g>
  <g stroke="#0c3a36" stroke-width="6" fill="none" opacity="0.6">
    <path d="M120 380 H520 V560 H640"/>
    <path d="M960 560 H1120 V380 H1480"/>
  </g>
  <!-- coolant window: glowing liquid -->
  <g>
    <rect x="420" y="470" width="90" height="60" rx="8" fill="#0a2a26" stroke="#4a8a84" stroke-width="5"/>
    <rect x="432" y="480" width="66" height="40" rx="4" fill="url(#coolant)" opacity="0.9"/>
    <circle cx="465" cy="500" r="18" fill="#7ef0e0" opacity="0.35" filter="url(#soft6)"/>
    <path d="M440 506 h50" stroke="#7ef0e0" stroke-width="3" opacity="0.7"/>
  </g>
  <!-- flange joints -->
  <g fill="#5a4630">
    <rect x="330" y="368" width="30" height="46" rx="6"/>
    <rect x="1250" y="368" width="30" height="46" rx="6"/>
  </g>

  <!-- control console -->
  <g>
    <rect x="1160" y="520" width="300" height="150" rx="10" fill="#1a1008" stroke="#4a2e18" stroke-width="5"/>
    <rect x="1180" y="540" width="140" height="110" rx="6" fill="#0c0806" stroke="#8a5a2a" stroke-width="3"/>
    <g stroke="#ff8c42" stroke-width="2.5" fill="none" opacity="0.9">
      <path d="M1198 620 L1218 590 L1238 604 L1258 578 L1278 596 L1298 570"/>
    </g>
    <g fill="#ffb16e">
      <circle cx="1206" cy="586" r="2.5"/><circle cx="1246" cy="580" r="2.5"/><circle cx="1286" cy="584" r="2.5"/>
    </g>
    <g fill="#ff8c42">
      <circle cx="1350" cy="566" r="9"/><circle cx="1380" cy="566" r="9" opacity="0.7"/>
      <circle cx="1410" cy="566" r="9"/><circle cx="1350" cy="596" r="9" opacity="0.6"/>
      <circle cx="1380" cy="596" r="9"/><circle cx="1410" cy="596" r="9" opacity="0.7"/>
    </g>
    <circle cx="1350" cy="566" r="3.5" fill="#ffe0b0"/>
    <circle cx="1410" cy="566" r="3.5" fill="#ffe0b0"/>
    <circle cx="1380" cy="596" r="3.5" fill="#ffe0b0"/>
    <rect x="1330" y="626" width="100" height="10" rx="5" fill="#ff8c42" opacity="0.6"/>
  </g>

  <!-- warning signage -->
  <g>
    <rect x="200" y="420" width="240" height="120" rx="8" fill="#241608" stroke="#ff8c42" stroke-width="5"/>
    <path d="M320 448 L392 570 L248 570 Z" fill="none" stroke="#ff8c42" stroke-width="5" stroke-linejoin="round"/>
    <rect x="314" y="500" width="12" height="34" rx="6" fill="#ff8c42"/>
    <circle cx="320" cy="552" r="6" fill="#ff8c42"/>
  </g>

  <!-- radiation stripes on columns -->
  <g fill="#8a5a2a" opacity="0.7">
    <path d="M60 240 h60 l-14 22 h-46 Z M106 240 h60 l-14 22 h-46 Z"/>
    <path d="M60 300 h60 l-14 22 h-46 Z M106 300 h60 l-14 22 h-46 Z"/>
    <path d="M1480 240 h60 l-14 22 h-46 Z M1434 240 h60 l-14 22 h-46 Z"/>
    <path d="M1480 300 h60 l-14 22 h-46 Z M1434 300 h60 l-14 22 h-46 Z"/>
  </g>
  <g fill="#ff8c42" opacity="0.5">
    <path d="M74 240 h-14 v22 h14 Z M120 240 h-14 v22 h14 Z"/>
    <path d="M74 300 h-14 v22 h14 Z M120 300 h-14 v22 h14 Z"/>
    <path d="M1454 240 h14 v22 h-14 Z M1408 240 h14 v22 h-14 Z"/>
    <path d="M1454 300 h14 v22 h-14 Z M1408 300 h14 v22 h-14 Z"/>
  </g>

  <!-- floor -->
  <rect x="0" y="660" width="1600" height="240" fill="#120a05"/>
  <path d="M0 660 H1600" stroke="#4a2e18" stroke-width="8"/>
  <g stroke="#3a2413" stroke-width="3" opacity="0.7">
    <path d="M0 710 H1600 M0 770 H1600 M0 840 H1600"/>
    <path d="M160 660 V900 M480 660 V900 M800 660 V900 M1120 660 V900 M1440 660 V900"/>
  </g>
  <!-- coolant leak on floor -->
  <ellipse cx="1300" cy="780" rx="160" ry="26" fill="#2a8a84" opacity="0.25"/>
  <ellipse cx="1300" cy="780" rx="90" ry="14" fill="#4fd0c8" opacity="0.3"/>
  <ellipse cx="1300" cy="780" rx="50" ry="8" fill="#7ef0e0" opacity="0.4"/>

  <!-- ceiling pipe shadow + holo line -->
  <path d="M0 150 H1600" stroke="#0c0806" stroke-width="40" opacity="0.6"/>
  <path d="M0 220 H1600" stroke="#ff8c42" stroke-width="3" opacity="0.18"/>
  <rect width="1600" height="900" fill="none" stroke="#0a0502" stroke-width="220" opacity="0.55"/>
</svg>
