<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="货物区：集装箱、坏灯与甲板帮涂鸦">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1120"/>
      <stop offset="1" stop-color="#080b14"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dbe4f5" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#dbe4f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flicker" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb16e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb16e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#273148"/>
      <stop offset="1" stop-color="#141a2c"/>
    </linearGradient>
    <linearGradient id="crate2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3a24"/>
      <stop offset="1" stop-color="#1a2414"/>
    </linearGradient>
    <linearGradient id="crate3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2e18"/>
      <stop offset="1" stop-color="#2c1a0c"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>

  <!-- ceiling girders -->
  <g stroke="#1c2a4a" stroke-width="10" fill="none">
    <path d="M0 140 H1600"/>
    <path d="M200 60 V140 M600 60 V140 M1000 60 V140 M1400 60 V140"/>
  </g>
  <path d="M0 96 H1600" stroke="#273148" stroke-width="4" opacity="0.6"/>

  <!-- hanging lamps: one lit, one dead, one flickering -->
  <g>
    <path d="M260 140 V220" stroke="#273148" stroke-width="5"/>
    <rect x="236" y="220" width="48" height="16" rx="4" fill="#1a2032"/>
    <circle cx="260" cy="236" r="80" fill="url(#lampGlow)"/>
    <circle cx="260" cy="236" r="10" fill="#dbe4f5"/>
  </g>
  <g>
    <path d="M760 140 V220" stroke="#273148" stroke-width="5"/>
    <rect x="736" y="220" width="48" height="16" rx="4" fill="#1a2032"/>
    <circle cx="760" cy="236" r="9" fill="#273148"/>
    <circle cx="760" cy="236" r="4" fill="#0a0f1c"/>
  </g>
  <g>
    <path d="M1260 140 V220" stroke="#273148" stroke-width="5"/>
    <rect x="1236" y="220" width="48" height="16" rx="4" fill="#1a2032"/>
    <circle cx="1260" cy="236" r="80" fill="url(#flicker)"/>
    <circle cx="1260" cy="236" r="9" fill="#ffb16e" opacity="0.8"/>
  </g>

  <!-- huge containers -->
  <g>
    <rect x="80" y="320" width="420" height="300" rx="6" fill="url(#crate)"/>
    <rect x="80" y="320" width="420" height="300" rx="6" fill="none" stroke="#1c2a4a" stroke-width="5"/>
    <g stroke="#4f7dff" stroke-width="4" opacity="0.6">
      <path d="M110 350 H550 M110 390 H550 M110 430 H550"/>
    </g>
    <text x="290" y="560" text-anchor="middle" font-family="monospace" font-size="52" fill="#7ea2ff" opacity="0.75">SC-04</text>
    <rect x="96" y="584" width="70" height="22" rx="4" fill="none" stroke="#7ea2ff" stroke-width="3" opacity="0.7"/>
    <g stroke="#7ea2ff" stroke-width="3" opacity="0.7">
      <path d="M104 596 h20 M104 602 h14"/>
    </g>
    <circle cx="486" cy="330" r="7" fill="#4fd08a" opacity="0.7"/>
  </g>
  <g>
    <rect x="560" y="380" width="360" height="240" rx="6" fill="url(#crate2)"/>
    <rect x="560" y="380" width="360" height="240" rx="6" fill="none" stroke="#26361f" stroke-width="5"/>
    <text x="740" y="540" text-anchor="middle" font-family="monospace" font-size="46" fill="#6ba368" opacity="0.7">AG-11</text>
    <g stroke="#3f5a33" stroke-width="4" opacity="0.6">
      <path d="M740 560 h-80 M740 572 h-60"/>
    </g>
  </g>
  <g>
    <rect x="980" y="300" width="460" height="320" rx="6" fill="url(#crate3)"/>
    <rect x="980" y="300" width="460" height="320" rx="6" fill="none" stroke="#4a2e18" stroke-width="5"/>
    <text x="1210" y="520" text-anchor="middle" font-family="monospace" font-size="50" fill="#ff8c42" opacity="0.7">HZ-02</text>
    <!-- hazard glyph -->
    <path d="M1210 430 l40 66 h-80 Z" fill="none" stroke="#ff8c42" stroke-width="5" stroke-linejoin="round"/>
    <rect x="1206" y="452" width="8" height="18" rx="4" fill="#ff8c42"/>
    <circle cx="1210" cy="480" r="4" fill="#ff8c42"/>
  </g>

  <!-- deck-gang graffiti -->
  <g opacity="0.85">
    <path d="M130 260 q10 -14 26 0 q-8 16 -26 0 Z" fill="#e04a6a" opacity="0.8"/>
    <text x="180" y="272" font-family="monospace" font-size="34" fill="#e04a6a" opacity="0.75">DECK-9</text>
    <path d="M1180 640 l8 12 -8 10 -8 -10 Z" fill="#4fd08a" opacity="0.6"/>
    <path d="M1164 664 h48" stroke="#4fd08a" stroke-width="4" opacity="0.6"/>
  </g>

  <!-- broken light pool -->
  <ellipse cx="760" cy="620" rx="260" ry="40" fill="#02040a" opacity="0.55"/>

  <!-- floor -->
  <rect x="0" y="620" width="1600" height="280" fill="#0a0f1c"/>
  <g stroke="#1c2a4a" stroke-width="4" opacity="0.7">
    <path d="M0 660 H1600 M0 720 H1600 M0 800 H1600 M0 880 H1600"/>
    <path d="M200 620 V900 M560 620 V900 M920 620 V900 M1280 620 V900"/>
  </g>
  <!-- cargo marks on floor -->
  <g stroke="#4f7dff" stroke-width="3" opacity="0.4">
    <rect x="230" y="740" width="240" height="100" fill="none" stroke-dasharray="18 12"/>
    <rect x="600" y="760" width="200" height="80" fill="none" stroke-dasharray="18 12"/>
    <text x="350" y="700" text-anchor="middle" font-family="monospace" font-size="24" fill="#4f7dff" opacity="0.5">LOAD-01</text>
  </g>

  <!-- scattered cargo straps + debris -->
  <path d="M240 640 q60 30 120 0" stroke="#273148" stroke-width="8" fill="none"/>
  <g fill="#273148">
    <rect x="1450" y="700" width="90" height="24" rx="4" opacity="0.8"/>
    <rect x="1460" y="724" width="40" height="14" rx="3" opacity="0.6"/>
    <circle cx="480" cy="820" r="10" opacity="0.5"/>
    <circle cx="500" cy="840" r="6" opacity="0.4"/>
  </g>

  <rect width="1600" height="900" fill="none" stroke="#02040a" stroke-width="220" opacity="0.6"/>
</svg>
