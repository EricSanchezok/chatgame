<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="居住舱环：环形走廊、舱门与全息广告">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131826"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2032"/>
      <stop offset="1" stop-color="#0d1120"/>
    </linearGradient>
    <linearGradient id="doorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#2f6fff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="holoAd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7dff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7ea2ff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft6" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>

  <!-- curved ceiling ring lines -->
  <g stroke="#273148" stroke-width="5" fill="none">
    <path d="M0 120 Q800 60 1600 120"/>
    <path d="M0 170 Q800 100 1600 170"/>
  </g>
  <g stroke="#4f7dff" stroke-width="2" fill="none" opacity="0.4">
    <path d="M120 130 Q800 74 1480 130"/>
  </g>
  <!-- ceiling lights -->
  <g fill="#dbe4f5" opacity="0.9">
    <rect x="140" y="150" width="90" height="8" rx="4"/>
    <rect x="380" y="146" width="90" height="8" rx="4"/>
    <rect x="620" y="150" width="90" height="8" rx="4"/>
    <rect x="860" y="146" width="90" height="8" rx="4"/>
    <rect x="1100" y="150" width="90" height="8" rx="4"/>
    <rect x="1340" y="146" width="90" height="8" rx="4"/>
  </g>

  <!-- air vent -->
  <g>
    <rect x="70" y="200" width="160" height="46" rx="6" fill="#0a0f1c" stroke="#273148" stroke-width="3"/>
    <g stroke="#273148" stroke-width="3">
      <path d="M86 212 L214 212 M86 222 L214 222 M86 232 L214 232"/>
    </g>
  </g>
  <g>
    <rect x="1370" y="200" width="160" height="46" rx="6" fill="#0a0f1c" stroke="#273148" stroke-width="3"/>
    <g stroke="#273148" stroke-width="3">
      <path d="M1386 212 L1514 212 M1386 222 L1514 222 M1386 232 L1514 232"/>
    </g>
  </g>

  <!-- holo ad board -->
  <g>
    <rect x="1120" y="240" width="340" height="200" rx="12" fill="url(#holoAd)" stroke="#5f9fff" stroke-width="3"/>
    <rect x="1120" y="240" width="340" height="200" rx="12" fill="none" stroke="#dbe4f5" stroke-width="1" opacity="0.5"/>
    <text x="1290" y="300" text-anchor="middle" font-family="monospace" font-size="30" fill="#dbe4f5" opacity="0.9">NEW BATCH</text>
    <text x="1290" y="340" text-anchor="middle" font-family="monospace" font-size="22" fill="#7ea2ff" opacity="0.9">合成食品 · 到港</text>
    <path d="M1160 380 q130 -30 260 0" stroke="#5f9fff" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="1290" cy="270" r="30" fill="none" stroke="#5f9fff" stroke-width="2" opacity="0.6"/>
    <circle cx="1290" cy="270" r="8" fill="#7ea2ff"/>
  </g>

  <!-- doors: left wall -->
  <g>
    <rect x="160" y="360" width="230" height="420" rx="18" fill="#0d1424" stroke="#273148" stroke-width="6"/>
    <rect x="178" y="378" width="194" height="384" rx="12" fill="#131c30"/>
    <rect x="196" y="398" width="158" height="344" rx="8" fill="url(#doorGlow)"/>
    <rect x="196" y="398" width="158" height="344" rx="8" fill="none" stroke="#4f7dff" stroke-width="3"/>
    <rect x="248" y="560" width="54" height="12" rx="6" fill="#7ea2ff"/>
    <rect x="232" y="590" width="86" height="10" rx="5" fill="#273148"/>
    <!-- door number -->
    <text x="275" y="470" text-anchor="middle" font-family="monospace" font-size="26" fill="#dbe4f5">B-12</text>
    <!-- status light -->
    <circle cx="214" cy="420" r="6" fill="#4fd08a"/>
    <circle cx="214" cy="420" r="12" fill="#4fd08a" opacity="0.2" filter="url(#soft6)"/>
  </g>
  <g>
    <rect x="430" y="380" width="230" height="400" rx="18" fill="#0d1424" stroke="#273148" stroke-width="6"/>
    <rect x="448" y="398" width="194" height="364" rx="12" fill="#131c30"/>
    <rect x="466" y="416" width="158" height="328" rx="8" fill="url(#doorGlow)" opacity="0.7"/>
    <rect x="466" y="416" width="158" height="328" rx="8" fill="none" stroke="#4f7dff" stroke-width="3"/>
    <rect x="518" y="568" width="54" height="12" rx="6" fill="#7ea2ff"/>
    <text x="545" y="486" text-anchor="middle" font-family="monospace" font-size="26" fill="#dbe4f5">B-13</text>
    <circle cx="484" cy="438" r="6" fill="#4fd08a"/>
    <circle cx="484" cy="438" r="12" fill="#4fd08a" opacity="0.2" filter="url(#soft6)"/>
  </g>

  <!-- doors: right wall (dimmed, one broken) -->
  <g>
    <rect x="1150" y="380" width="230" height="400" rx="18" fill="#0d1424" stroke="#273148" stroke-width="6"/>
    <rect x="1168" y="398" width="194" height="364" rx="12" fill="#131c30"/>
    <rect x="1186" y="416" width="158" height="328" rx="8" fill="url(#doorGlow)" opacity="0.55"/>
    <rect x="1186" y="416" width="158" height="328" rx="8" fill="none" stroke="#4f7dff" stroke-width="3"/>
    <rect x="1238" y="568" width="54" height="12" rx="6" fill="#7ea2ff" opacity="0.6"/>
    <text x="1265" y="486" text-anchor="middle" font-family="monospace" font-size="26" fill="#dbe4f5">B-31</text>
    <circle cx="1204" cy="438" r="6" fill="#4fd08a"/>
    <circle cx="1204" cy="438" r="12" fill="#4fd08a" opacity="0.2" filter="url(#soft6)"/>
  </g>
  <g>
    <rect x="1420" y="380" width="230" height="400" rx="18" fill="#0d1424" stroke="#273148" stroke-width="6"/>
    <rect x="1438" y="398" width="194" height="364" rx="12" fill="#131c30"/>
    <rect x="1456" y="416" width="158" height="328" rx="8" fill="url(#doorGlow)" opacity="0.3"/>
    <rect x="1456" y="416" width="158" height="328" rx="8" fill="none" stroke="#4f7dff" stroke-width="3"/>
    <text x="1535" y="486" text-anchor="middle" font-family="monospace" font-size="26" fill="#8494b3">B-32</text>
    <circle cx="1474" cy="438" r="6" fill="#ff8c42"/>
    <circle cx="1474" cy="438" r="12" fill="#ff8c42" opacity="0.25" filter="url(#soft6)"/>
    <path d="M1464 448 l20 -20 M1484 448 l-20 -20" stroke="#ff8c42" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- window strip between doors -->
  <g>
    <rect x="700" y="380" width="200" height="120" rx="10" fill="#02040a" stroke="#273148" stroke-width="5"/>
    <g fill="#dbe4f5">
      <circle cx="750" cy="420" r="2" opacity="0.9"/><circle cx="810" cy="440" r="1.4" opacity="0.6"/>
      <circle cx="860" cy="412" r="1.8" opacity="0.7"/><circle cx="780" cy="460" r="1.2" opacity="0.5"/>
    </g>
    <circle cx="860" cy="412" r="10" fill="#4f7dff" opacity="0.2" filter="url(#soft6)"/>
  </g>

  <!-- railing + mid deck -->
  <rect x="0" y="790" width="1600" height="20" fill="#1a2032"/>
  <g stroke="#273148" stroke-width="4">
    <path d="M0 790 V740 M100 790 V740 M200 790 V740 M300 790 V740 M400 790 V740 M500 790 V740 M600 790 V740 M700 790 V740 M800 790 V740 M900 790 V740 M1000 790 V740 M1100 790 V740 M1200 790 V740 M1300 790 V740 M1400 790 V740 M1500 790 V740"/>
    <path d="M0 750 H1600"/>
  </g>

  <!-- floor -->
  <rect x="0" y="810" width="1600" height="90" fill="url(#floor)"/>
  <path d="M0 810 H1600" stroke="#4f7dff" stroke-width="3" opacity="0.5"/>
  <g stroke="#273148" stroke-width="3" opacity="0.7">
    <path d="M0 840 H1600 M0 870 H1600"/>
    <path d="M160 810 V870 M480 810 V870 M800 810 V870 M1120 810 V870 M1440 810 V870"/>
  </g>
  <!-- painted guidance line -->
  <path d="M0 862 H1600" stroke="#2f6fff" stroke-width="6" stroke-dasharray="60 40" opacity="0.35"/>

  <!-- atmosphere: faint fog from vents -->
  <g fill="#7ea2ff" filter="url(#soft)" opacity="0.05">
    <ellipse cx="150" cy="280" rx="200" ry="30"/>
    <ellipse cx="1450" cy="280" rx="200" ry="30"/>
  </g>
  <rect width="1600" height="900" fill="none" stroke="#02040a" stroke-width="220" opacity="0.5"/>
</svg>
