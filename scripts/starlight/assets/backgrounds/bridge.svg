<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="星港舰桥：舷窗深空与全息星图">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02040a"/>
      <stop offset="0.6" stop-color="#060a14"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.3" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#4f7dff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#2f4f9f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2f4f9f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dbe4f5"/>
      <stop offset="0.4" stop-color="#dbe4f5" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#dbe4f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7ea2ff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131c30"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft16" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#space)"/>

  <!-- deep space through the viewport -->
  <circle cx="480" cy="270" r="500" fill="url(#nebula)"/>
  <g fill="#dbe4f5">
    <circle cx="90" cy="80" r="2" opacity="0.9"/><circle cx="220" cy="140" r="1.4" opacity="0.6"/>
    <circle cx="330" cy="60" r="1.8" opacity="0.8"/><circle cx="520" cy="120" r="1.2" opacity="0.5"/>
    <circle cx="660" cy="70" r="2" opacity="0.9"/><circle cx="780" cy="150" r="1.4" opacity="0.6"/>
    <circle cx="900" cy="90" r="1.8" opacity="0.7"/><circle cx="1020" cy="160" r="1.2" opacity="0.5"/>
    <circle cx="1150" cy="70" r="2" opacity="0.85"/><circle cx="1280" cy="130" r="1.5" opacity="0.6"/>
    <circle cx="1400" cy="60" r="1.8" opacity="0.8"/><circle cx="1520" cy="120" r="1.2" opacity="0.5"/>
    <circle cx="180" cy="250" r="1.5" opacity="0.6"/><circle cx="420" cy="330" r="1.2" opacity="0.5"/>
    <circle cx="1330" cy="280" r="1.5" opacity="0.6"/>
  </g>
  <circle cx="90" cy="80" r="14" fill="url(#starGlow)"/>
  <circle cx="660" cy="70" r="16" fill="url(#starGlow)"/>
  <circle cx="1150" cy="70" r="15" fill="url(#starGlow)"/>
  <!-- distant station silhouette -->
  <g opacity="0.5">
    <rect x="120" y="180" width="90" height="10" rx="5" fill="#8494b3"/>
    <rect x="150" y="150" width="30" height="30" fill="#8494b3"/>
    <circle cx="165" cy="165" r="22" fill="none" stroke="#8494b3" stroke-width="4"/>
  </g>

  <!-- viewport frame -->
  <path d="M60 460 L60 160 Q60 80 140 80 H1460 Q1540 80 1540 160 V460 Z" fill="#04060d"/>
  <rect x="100" y="120" width="1400" height="300" fill="#02040a"/>
  <path d="M60 460 L60 160 Q60 80 140 80 H1460 Q1540 80 1540 160 V460 Z" fill="none" stroke="#1c2a4a" stroke-width="14"/>
  <path d="M100 120 H1500 V420 H100 Z" fill="none" stroke="#0d1424" stroke-width="6"/>

  <!-- console ring -->
  <path d="M120 620 Q800 520 1480 620 L1480 900 L120 900 Z" fill="url(#panel)"/>
  <path d="M120 620 Q800 520 1480 620 L1480 636 Q800 536 120 636 Z" fill="#1a2032"/>
  <!-- console top edge light -->
  <path d="M120 620 Q800 520 1480 620" stroke="#5f9fff" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- holomap -->
  <g>
    <ellipse cx="800" cy="440" rx="300" ry="90" fill="#4f7dff" opacity="0.08" filter="url(#soft16)"/>
    <ellipse cx="800" cy="440" rx="300" ry="90" fill="none" stroke="url(#holo)" stroke-width="2.5"/>
    <ellipse cx="800" cy="440" rx="210" ry="60" fill="none" stroke="url(#holo)" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="800" cy="440" rx="110" ry="32" fill="none" stroke="url(#holo)" stroke-width="1.5" opacity="0.6"/>
    <path d="M800 440 L500 440 M800 440 L1100 440 M800 440 L680 380 M800 440 L920 500" stroke="#7ea2ff" stroke-width="1.5" opacity="0.7"/>
    <g fill="#7ea2ff">
      <circle cx="800" cy="440" r="7"/>
      <circle cx="670" cy="420" r="4.5" opacity="0.9"/>
      <circle cx="930" cy="462" r="5" opacity="0.9"/>
      <circle cx="600" cy="470" r="3.5" opacity="0.7"/>
      <circle cx="990" cy="415" r="3.5" opacity="0.7"/>
    </g>
    <circle cx="670" cy="420" r="14" fill="#5f9fff" opacity="0.15" filter="url(#soft)"/>
    <circle cx="930" cy="462" r="14" fill="#5f9fff" opacity="0.15" filter="url(#soft)"/>
    <!-- orbit of a small moon -->
    <circle cx="930" cy="462" r="26" fill="none" stroke="#5f9fff" stroke-width="1" opacity="0.6"/>
    <circle cx="952" cy="446" r="3" fill="#dbe4f5"/>
  </g>

  <!-- console screens -->
  <g>
    <rect x="180" y="640" width="220" height="130" rx="10" fill="#0a0f1c" stroke="#273148" stroke-width="4"/>
    <g stroke="#5f9fff" stroke-width="2" fill="none" opacity="0.9">
      <path d="M206 700 L226 676 L246 692 L266 664 L286 684 L306 660 L326 678 L346 654 L366 672"/>
    </g>
    <g fill="#7ea2ff" opacity="0.8">
      <circle cx="216" cy="668" r="2"/><circle cx="266" cy="676" r="2"/><circle cx="316" cy="668" r="2"/><circle cx="366" cy="682" r="2"/>
    </g>
    <rect x="190" y="726" width="60" height="10" rx="3" fill="#2f6fff" opacity="0.8"/>
    <rect x="256" y="726" width="40" height="10" rx="3" fill="#2f6fff" opacity="0.5"/>
  </g>
  <g>
    <rect x="1200" y="640" width="220" height="130" rx="10" fill="#0a0f1c" stroke="#273148" stroke-width="4"/>
    <g stroke="#5f9fff" stroke-width="2" fill="none" opacity="0.9">
      <path d="M1226 700 L1246 660 L1266 690 L1286 668 L1306 690 L1326 656 L1346 676 L1366 652 L1386 670"/>
    </g>
    <g fill="#7ea2ff" opacity="0.8">
      <circle cx="1246" cy="668" r="2"/><circle cx="1286" cy="676" r="2"/><circle cx="1346" cy="666" r="2"/><circle cx="1386" cy="680" r="2"/>
    </g>
    <rect x="1210" y="726" width="70" height="10" rx="3" fill="#2f6fff" opacity="0.8"/>
  </g>

  <!-- side consoles with buttons -->
  <g>
    <rect x="520" y="760" width="280" height="60" rx="8" fill="#131c30" stroke="#273148" stroke-width="3"/>
    <g fill="#4f7dff">
      <circle cx="548" cy="790" r="8"/><circle cx="578" cy="790" r="8" opacity="0.7"/>
      <circle cx="608" cy="790" r="8"/><circle cx="638" cy="790" r="8" opacity="0.5"/>
      <circle cx="668" cy="790" r="8"/><circle cx="698" cy="790" r="8" opacity="0.7"/>
    </g>
    <circle cx="548" cy="790" r="3" fill="#dbe4f5"/>
    <circle cx="608" cy="790" r="3" fill="#dbe4f5"/>
    <circle cx="668" cy="790" r="3" fill="#dbe4f5"/>
    <rect x="716" y="772" width="70" height="36" rx="6" fill="#2f6fff" opacity="0.6"/>
  </g>
  <g>
    <rect x="860" y="760" width="220" height="60" rx="8" fill="#131c30" stroke="#273148" stroke-width="3"/>
    <rect x="878" y="776" width="184" height="8" rx="4" fill="#0a0f1c"/>
    <rect x="878" y="776" width="132" height="8" rx="4" fill="#2f6fff" opacity="0.7"/>
    <rect x="878" y="792" width="184" height="8" rx="4" fill="#0a0f1c"/>
    <rect x="878" y="792" width="88" height="8" rx="4" fill="#ff8c42" opacity="0.6"/>
  </g>

  <!-- floor light strip -->
  <path d="M0 900 H1600" stroke="#273148" stroke-width="8"/>
  <path d="M200 900 H1400" stroke="#4f7dff" stroke-width="4" opacity="0.7"/>

  <!-- holo ring light sweep -->
  <g opacity="0.5">
    <path d="M430 300 a370 370 0 0 1 740 0" fill="none" stroke="#5f9fff" stroke-width="2"/>
    <path d="M500 300 a300 300 0 0 1 600 0" fill="none" stroke="#5f9fff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <rect width="1600" height="900" fill="none" stroke="#02040a" stroke-width="220" opacity="0.5"/>
</svg>
