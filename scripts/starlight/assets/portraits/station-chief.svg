<svg xmlns="http://www.w3.org/2000/svg" width="512" height="768" viewBox="0 0 512 768" role="img" aria-label="沈站长：星港站长，深蓝制服与站徽">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="0.6" stop-color="#080c18"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#4f7dff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4cfa8"/>
      <stop offset="1" stop-color="#bea07c"/>
    </linearGradient>
    <linearGradient id="uniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27314a"/>
      <stop offset="1" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c07a"/>
      <stop offset="1" stop-color="#a8845a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="512" height="768" rx="28" fill="url(#bg)"/>
  <circle cx="256" cy="250" r="300" fill="url(#bgGlow)"/>
  <!-- station seal background -->
  <g opacity="0.14" stroke="#7ea2ff" fill="none">
    <circle cx="96" cy="170" r="44" stroke-width="3"/>
    <circle cx="96" cy="170" r="30" stroke-width="2"/>
    <path d="M96 126 v14 M96 214 v-14 M52 170 h14 M126 170 h-14" stroke-width="2"/>
    <circle cx="96" cy="170" r="8" stroke-width="2"/>
  </g>

  <!-- torso: command uniform -->
  <path d="M100 768 Q96 568 154 484 Q192 428 256 416 Q320 428 358 484 Q416 568 416 768 Z" fill="url(#uniform)"/>
  <path d="M100 768 Q96 568 154 484 Q192 428 256 416 L256 768 Z" fill="#0d1424" opacity="0.55"/>
  <!-- double-breasted front -->
  <path d="M182 478 Q256 454 330 478 L342 680 Q256 712 170 680 Z" fill="#1c2640"/>
  <path d="M182 478 Q256 454 330 478 L322 506 Q256 486 190 506 Z" fill="#27314a"/>
  <g fill="url(#gold)">
    <circle cx="216" cy="528" r="6"/><circle cx="296" cy="528" r="6"/>
    <circle cx="216" cy="580" r="6"/><circle cx="296" cy="580" r="6"/>
    <circle cx="216" cy="632" r="6"/><circle cx="296" cy="632" r="6"/>
  </g>
  <path d="M226 528 h60 M226 580 h60 M226 632 h60" stroke="#a8845a" stroke-width="3" opacity="0.7"/>
  <!-- station badge on chest -->
  <g>
    <circle cx="256" cy="548" r="26" fill="#141c30" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="256" cy="548" r="18" fill="none" stroke="#e8c07a" stroke-width="2"/>
    <path d="M256 534 l6 10 -6 4 -6 -4 Z" fill="#e8c07a"/>
    <path d="M250 548 h12 M250 552 h8" stroke="#e8c07a" stroke-width="2"/>
  </g>
  <!-- shoulder boards -->
  <path d="M154 486 Q136 512 134 542 L176 556 Q180 514 176 496 Z" fill="#1c2640" stroke="#4f7dff" stroke-width="2"/>
  <path d="M358 486 Q376 512 378 542 L336 556 Q332 514 336 496 Z" fill="#1c2640" stroke="#4f7dff" stroke-width="2"/>
  <g fill="#e8c07a">
    <rect x="144" y="520" width="22" height="5" rx="2"/><rect x="148" y="530" width="18" height="5" rx="2"/>
    <rect x="346" y="520" width="22" height="5" rx="2"/><rect x="346" y="530" width="18" height="5" rx="2"/>
  </g>
  <!-- epaulet stars -->
  <path d="M156 540 l5 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1 Z" fill="#e8c07a" transform="scale(0.7) translate(70 230)"/>
  <path d="M356 540 l5 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1 Z" fill="#e8c07a" transform="scale(0.7) translate(300 230)"/>
  <!-- sleeve stripes -->
  <path d="M128 590 h20 M124 606 h24 M120 622 h28" stroke="url(#gold)" stroke-width="5"/>
  <path d="M384 590 h-20 M388 606 h-24 M392 622 h-28" stroke="url(#gold)" stroke-width="5"/>

  <!-- neck + high collar -->
  <path d="M228 402 Q256 394 284 402 L290 444 Q256 462 222 444 Z" fill="url(#skin)"/>
  <path d="M238 436 Q256 444 274 436 Q270 452 256 454 Q242 452 238 436 Z" fill="#8a6c50" opacity="0.5"/>
  <path d="M200 452 Q256 430 312 452 L306 476 Q256 458 206 476 Z" fill="#1c2640"/>
  <path d="M200 452 Q256 430 312 452 L308 462 Q256 442 204 462 Z" fill="#4f7dff" opacity="0.35"/>

  <!-- head: long, composed -->
  <ellipse cx="256" cy="270" rx="80" ry="96" fill="url(#skin)"/>
  <path d="M256 174 Q294 174 308 196 Q320 218 318 244 Q314 296 290 324 Q272 346 256 348 Q240 346 222 324 Q198 296 194 244 Q192 218 204 196 Q218 174 256 174 Z" fill="url(#skin)"/>
  <!-- cheekbones -->
  <path d="M204 276 q6 10 4 22 M308 276 q-6 10 -4 22" stroke="#a8845a" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- nasolabial lines -->
  <path d="M238 296 q-4 12 2 22 M274 296 q4 12 -2 22" stroke="#a8845a" stroke-width="3" fill="none" opacity="0.4"/>

  <!-- steady eyes -->
  <g>
    <path d="M206 260 Q220 254 236 260" stroke="#201408" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M276 260 Q292 254 308 260" stroke="#201408" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="221" cy="260" r="6" fill="#241808"/>
    <circle cx="291" cy="260" r="6" fill="#241808"/>
    <circle cx="223" cy="258" r="2" fill="#f0e4c8"/>
    <circle cx="293" cy="258" r="2" fill="#f0e4c8"/>
  </g>
  <!-- stern brows -->
  <path d="M200 246 Q218 240 236 246" stroke="#3a3024" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M276 246 Q294 240 312 246" stroke="#3a3024" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M256 272 Q250 290 246 300 Q256 306 266 300 Q262 290 256 272 Z" fill="#d4b488" opacity="0.9"/>
  <path d="M256 304 Q250 308 246 302" stroke="#a8845a" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- firm mouth -->
  <path d="M236 326 Q256 330 276 326" stroke="#8a5c42" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M212 318 q10 4 20 4 M300 318 q-10 4 -20 4" stroke="#8a5c42" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- ears -->
  <path d="M176 272 Q162 270 160 290 Q164 306 180 306 Z" fill="url(#skin)"/>
  <path d="M336 272 Q350 270 352 290 Q348 306 332 306 Z" fill="url(#skin)"/>

  <!-- swept grey-black hair -->
  <path d="M188 234 Q186 150 256 138 Q326 150 324 234 Q322 182 300 158 Q278 142 256 140 Q234 142 212 158 Q190 182 188 234 Z" fill="#3a3a3a"/>
  <path d="M188 234 Q186 150 256 138 Q326 150 324 234" fill="none" stroke="#222222" stroke-width="4"/>
  <path d="M192 200 q10 -20 30 -30 q0 24 -12 38 q-12 2 -18 -8 Z" fill="#2a2a2a"/>
  <path d="M320 200 q-10 -20 -30 -30 q0 24 12 38 q12 2 18 -8 Z" fill="#2a2a2a"/>
  <path d="M200 210 q4 -10 12 -14 M250 186 q8 -8 18 -8 M312 210 q-4 -10 -12 -14" stroke="#4a4a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
