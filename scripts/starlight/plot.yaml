commitments:
  - id: p07-handoff
    description: "P-07 事故必须在下一次交班时形成可审计的处置反馈"
    type: 交班责任
    trigger:
      time: { day: 1, hour: 14 }
    must_happen: true
    deadline:
      time: { day: 1 }
      on_miss:
        escalation_text: "P-07 未被处置，灯塔按登记册切断 H-12 至 H-18 的册外空气份额"
        effects:
          - { kind: flag, direction: set, target: player, flag: p07-handoff-missed }
    related: { events: [scrubber-p07-alert], npcs: [chief-engineer, doctor-vera, night-cat], locations: [reactor-level, hab-ring] }
  - id: lighthouse-register-dispute
    description: "两百年前登记册排除册外人口的事实最终进入公开交班记录"
    type: 制度线索
    trigger:
      condition:
        all:
          - { source: flag, key: lighthouse-ledger-copy, op: has }
    must_happen: true
    related: { secrets: [unregistered-clinic-count, lighthouse-ledger-copy], npcs: [doctor-vera, night-cat] }
