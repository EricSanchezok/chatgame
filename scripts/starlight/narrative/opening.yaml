scene: "夜班 07:42。维修主干 B-12 的琥珀扫灯只转了一圈便停住，热敏纸吐出一张新工单：P-07 颗粒阀压差超限，影响 H-12 至 H-18。你的交班签写着‘维修二班’，没有舰长权限，也没有无限库存。"
first_lines:
  - "老周把还带着体温的扳手放到台面上：‘四只备用滤芯，二十三小时后才有补给。先查清楚，再签。’"
  - "林小北从居住环接入无线电：‘这里实住六十三人。灯塔的工单只写四十一。’"
  - "灯塔随后播报：‘依据登记册 REG-2178，未发现配给人口异常。’"
hooks:
  - text: "你持有 B-12 交班签与 E-4 舱外作业资格，可检查设备、申请旁路或去货运窗口谈一笔例外。"
