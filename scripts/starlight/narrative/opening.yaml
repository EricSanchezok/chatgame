scene: "你从睡眠舱的低温循环中被唤醒，金属舱壁渗出冷凝水。星港的重力模拟器发出熟悉的低频嗡鸣，像一艘大船在深空里轻轻摇晃。舷窗外，锚点的导航灯每十二秒闪一次。"
first_lines:
  - "你推开通往居住舱环的气密门，空气里是循环过滤器的味道。"
  - "腕带屏幕亮起，灯塔的通知在蓝光里滚动：'欢迎回来，今日配给正常。'"
hooks:
  - text: "你是这里的熟面孔，巡逻的站务看见你，只点了点头。"
    condition: { source: flag, key: returned_visitor, op: has }
  - text: "甲板帮的线人认出你，冲你比了个只有自己人懂的手势。"
    condition: { source: reputation, key: deck-gang, op: gte, value: 50 }
