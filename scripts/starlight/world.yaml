background: "星港不是舰桥，而是一座靠轮班维持呼吸的老旧民用空间站。两百年前启用的管理 AI‘灯塔’仍按首航登记册分配空气、水、电和维修件；登记册外的四十七名居民在系统里没有人口权重，只能依靠居住环互助会和货运配给员交换余量。玩家是维修二班的普通值班员，能签工单、进维修主干、申请舱外作业，却无权改写人口名册。每次处置都必须留下交班记录：你救下谁、挪用了什么、让哪个系统背上了风险，下一班都会看见。"
rules:
  - id: rule-authoritative-costs
    text: "工单的时间、物资、电网、疲劳余量、舱外氧和追踪热度只由引擎结算，口头承诺不能改变读数"
  - id: rule-worker-authority
    text: "值班员可以维修、旁路和申请配给例外，但不能以舰长或站长身份发布命令"
  - id: rule-eva-access
    text: "进入舱外桁架必须持有舱外服与有效的舱外作业资格"
  - id: rule-lighthouse-register
    text: "灯塔默认只为首航登记册中的人口计算生存资源；例外必须留下可审计痕迹"
taboos:
  - id: taboo-fake-authority
    text: "不得把玩家叙述成舰长、站长或对全站拥有无条件指挥权的人"
    severity: hard
  - id: taboo-ai-omniscience
    text: "灯塔只依据传感器、登记册与已记录工单判断，不得读心或凭空知晓线下交易"
    severity: hard
  - id: taboo-technobabble
    text: "避免用无意义的伪科学名词代替具体设备、成本与后果"
    severity: soft
glossary:
  - term: 灯塔
    aliases: [中枢, 配给 AI]
    definition: "沿用首航登记册分配生存资源的站务 AI；它执行旧规则，不是人格化暴君"
  - term: 登记人口
    aliases: [册内人口]
    definition: "被两百年前登记册及其合法后代链承认的人口，目前 182 人"
  - term: 册外人口
    aliases: [未登记居民, 册外居民]
    definition: "因迁入、收养和记录断裂而不被灯塔计入配给权重的 47 人"
  - term: 交班签
    aliases: [工种标签, 班签]
    definition: "证明值班员岗位、权限与责任范围的实体挂牌"
  - term: P-07
    aliases: [七号净化机, 空气净化机]
    definition: "服务居住环 H-12 到 H-18 的老式空气净化机，本班事故源"
